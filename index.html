  function drawGem(g, x, y, s, rot) {
    g.save(); g.translate(x, y); g.rotate(rot * 0.3);
    g.fillStyle = '#e8f4ff'; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.75, 0); g.lineTo(0, s); g.lineTo(-s * 0.75, 0); g.closePath(); g.fill();
    g.fillStyle = '#05040a'; g.beginPath(); g.moveTo(0, -s * 0.5); g.lineTo(s * 0.37, 0); g.lineTo(0, s * 0.5); g.lineTo(-s * 0.37, 0); g.closePath(); g.fill();
    g.restore();
  }

  // Bot/test için: (x,y) noktası dt sn sonra tehlikeli mi? (mermiler, sütunlar, ışınlar, ulti tehlikeleri)
  function predictDanger(x, y, r, dt) {
    const gy = H - GROUND_H;
    if (y + r >= gy) return true;
    for (const e of ebullets) {
      const tt = e.t + dt, ex = e.x + e.vx * dt + (e.ax ? 0.5 * e.ax * dt * dt : 0);
      let ey = e.amp ? e.baseY + e.vy * dt + Math.sin(tt * e.freq + e.ph) * e.amp : e.y + e.vy * dt + (e.grav ? 0.5 * e.grav * dt * dt : 0);
      if (e.zig) { ey = e.y; let t0 = e.t, rem = dt; while (rem > 1e-4) { const seg = Math.min(rem, (Math.floor(t0 / e.zig) + 1) * e.zig - t0 + 1e-6); ey += (Math.floor(t0 / e.zig) % 2 ? -1 : 1) * e.zigV * seg; t0 += seg; rem -= seg; } }
      if (e.split && tt >= e.split) continue;   // bölününce yerine parçalar gelir (onlar o an görülür)
      if (e.ring) { if (Math.abs(Math.hypot(x - ex, y - ey) - e.ring) < 4 + r) return true; continue; }
      const rr = e.r + r; if ((x - ex) ** 2 + (y - ey) ** 2 < rr * rr) return true;
    }
    for (const p of pipes) { const px = p.x - speed * dt; if (circleRect(x, y, r + 3, px, -100, PIPE_W, p.top + 100) || circleRect(x, y, r + 3, px, p.top + p.gap, PIPE_W, H)) return true; }
    for (const e of enemies) { const ex = e.free ? e.x - e.vx * dt : e.x - speed * dt; if ((x - ex) ** 2 + (y - e.y) ** 2 < (e.r + r + 2) ** 2) return true; }
    if (boss && boss.phase === 'fight') {
      const B = boss;
      for (const [cx, cy, cr] of bossCircs(B)) if ((x - cx) ** 2 + (y - cy) ** 2 < (cr + r + 4) ** 2) return true;
      if (B.beam) { const bt = B.beam.t + dt; if (bt > 0.98 && bt < 1.47) {
        if (B.beam.bolt) { if (Math.abs(x - B.beam.x) < 14 + r + 2 && (B.beam.top ? y < B.beam.split + 2 : y > B.beam.split - 2)) return true; }
        else for (const by of B.beam.ys) if (Math.abs(y - by) < 10 + r + 2 && x < B.x) return true; } }
    }
    for (const h of uhz) if (h.kill && h.t + dt >= 0 && h.kill(x, y, r, h.t + dt, h)) return true;
    return false;
  }

  function applySave() {
    const sv = storySave, p1 = players[0];
    if (!sv) return;
    p1.score = sv.score; score = sv.score;
    bossCount = sv.bossCount; nextBossAt = sv.nextBossAt;
    nextSaveAt = (Math.floor(sv.score / SAVE_EVERY) + 1) * SAVE_EVERY;
    dist = sv.dist || 0; lives = MAX_LIVES;
    setStoryTheme(storyTheme(), true); for (const q of pipes) q.theme = storyTheme(); for (const e of enemies) e.theme = storyTheme();
    banner(T('cont'), T('cont_sub', sv.score), '#49c6ff', 2.6);
  }

  function updateStory(dt) {
    const p1 = players[0];
    bossTint += ((boss ? 1 : 0) - bossTint) * Math.min(1, dt * 0.8);   // gökyüzü yavaşça kızarır
    lostHeartT = Math.max(0, lostHeartT - dt);
    for (const bn of banners) bn.t += dt;
    if (bossPhase === 'incoming') incomingT += dt;
    banners = banners.filter(bn => bn.t < bn.dur);

    // 1) eşik geçildi: sütunlar kesilir, uyarı
    if (!bossPhase && p1.score >= nextBossAt) {
      bossPhase = 'incoming'; incomingT = 0;
      const def = BOSSES[bossCount % BOSSES.length];
      banner(T('incoming'), T('incoming_sub', def.name), '#ff5fb4', 3);
      sfx.warn();
    }
    // 2) son sütun ekrandan çıkınca boss girer
    if (bossPhase === 'incoming' && pipes.every(p => p.x + PIPE_W < 0)) {
      pipes = [];
      boss = makeBoss(bossCount);
      bossPhase = 'fight';
      banner(boss.name.toUpperCase(), '"' + boss.def.quote + '"', boss.def.glow, 3);
    }
    // 3) boss yenildikten sonra kısa mola, sütunlar yavaşça geri gelir
    if (bossPhase === 'outro') {
      phaseT -= dt;
      if (phaseT <= 0) {
        bossPhase = null;
        for (let i = 0; i < 3; i++) addPipe(W + 60 + i * PIPE_SPACING);
        if (heartPending) {   // 2. sütunun boşluğuna bir can koy (orada düşman olmasın)
          const hp = pipes[1];
          hp.heart = { taken: false };
          enemies = enemies.filter(e => e.pipe !== hp);
          heartPending = false;
        }
      }
    }

    if (boss) updateBoss(dt);

    // boss mermileri
    for (const e of ebullets) {
      // Zümrüt Aura: yakınındaki boss mermileri yarı hıza düşer; Zaman Durdur: hepsi donar
      let k = timeStopT > 0 ? 0 : 1;
      if (k) for (const b of players) if (b.alive && qid(b) === 'zumrut' && (e.x - b.x) ** 2 + (e.y - b.y) ** 2 < ZUMRUT_AURA * ZUMRUT_AURA) { k = 0.5; break; }
      const ddt = dt * k;
      e.t += ddt;
      if (e.grav) e.vy += e.grav * ddt;
      if (e.home && e.t < Math.min(e.homeT, HOME_MAX)) {   // hafif yönelme: en fazla 0,8 sn, keskin dönemez
        const tg = players.find(p => p.alive);
        if (tg && Math.abs(tg.vy) > HOME_BREAK_VY) e.home = 0;   // kuş hızlı hareket etti: takibi bırakır, düz gider
        else if (tg) { const spd = Math.hypot(e.vx, e.vy), cur = Math.atan2(e.vy, e.vx); let want = Math.atan2(tg.y - e.y, tg.x - e.x) - cur;
          while (want > Math.PI) want -= Math.PI * 2; while (want < -Math.PI) want += Math.PI * 2;
          const na = cur + Math.max(-e.home * ddt, Math.min(e.home * ddt, want)); e.vx = Math.cos(na) * spd; e.vy = Math.sin(na) * spd; }
      }
      if (e.bounce && ((e.y < 16 && e.vy < 0) || (e.y > H - GROUND_H - 14 && e.vy > 0))) e.vy = -e.vy;
      if (e.ax) e.vx += e.ax * ddt;                                            // bumerang: yavaşlar, geri döner
      if (e.zig) e.vy = (Math.floor(e.t / e.zig) % 2 ? -1 : 1) * e.zigV;      // zikzak
      if (e.split && e.t >= e.split) {                                         // bölünen mermi: yelpaze gibi saçılır
        e.dead = true; burst(e.x, e.y, ['#ffffff', boss ? boss.def.glow : '#ccc'], 5, 80);
        for (let k = 0; k < e.splitN; k++) { const a = Math.PI + (k - (e.splitN - 1) / 2) * 0.42; ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * e.splitV, vy: Math.sin(a) * e.splitV, r: 7, rot: a, kind: e.kind, t: 0 }); }
        continue;
      }
      if (e.life && e.t > e.life) { e.dead = true; continue; }
      e.x += e.vx * ddt;
      if (e.amp) { e.baseY += e.vy * ddt; e.y = e.baseY + Math.sin(e.t * e.freq + e.ph) * e.amp; }
      else e.y += e.vy * ddt;
      // Pırıl'ın Elmas Kubbesi mermileri yok eder
      for (const b of players) if (b.alive && b.ultKind === 'piril' && b.ultT > 0 && (e.x - b.x) ** 2 + (e.y - b.y) ** 2 < 44 * 44) { e.dead = true; burst(e.x, e.y, ['#bfefff', '#ffffff'], 4, 80); }
      if (e.dead) continue;
      for (const b of players) {
        if (!b.alive) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (e.ring) { if (Math.abs(Math.hypot(dx, dy) - e.ring) < 4 + hazR(b) - 5) killPlayer(b); continue; }   // çemberin ortası güvenli
        const rr = e.r + hazR(b) - 5;
        if (dx * dx + dy * dy < rr * rr) { e.dead = true; killPlayer(b); }
      }
    }
    ebullets = ebullets.filter(e => !e.dead && e.x > -30 && e.x < W + 40 && e.y > (e.grav ? -200 : -40) && e.y < H - GROUND_H + 10);
    updateHz(dt);
  }

  function updateBoss(dt) {
    const B = boss;
    // yanma: her saniye +1 hasar
    if (B.burn > 0 && B.phase === 'fight') {
      B.burnTick = (B.burnTick || 1) - dt;
      B.burn -= dt;
      if (Math.random() < 0.5) particles.push({ x: B.x + (Math.random() - 0.5) * 40, y: B.y + 10, vx: (Math.random() - 0.5) * 20, vy: -60 - Math.random() * 40, life: 0.5, color: Math.random() < 0.5 ? '#ff7a33' : '#ffe23b', size: 2.5 });
      if (B.burnTick <= 0) { B.burnTick = 1; B.hp -= 1; B.hurt = 0.7; floaters.push({ x: B.x, y: B.y - 40, t: 0, c: '#ff7a33', txt: '-1' }); killBossCheck(); }
    }
    if (timeStopT > 0 && B.phase === 'fight') { B.hurt = Math.max(0, B.hurt - dt * 4); return; }   // zaman durdu
    B.t += dt;
    B.hurt = Math.max(0, B.hurt - dt * 4);
    // hareket yönüne göre eğilme: yumuşatılmış dikey hız (yükselirken gaga yukarı, inerken aşağı)
    if (dt > 0) { B.vyS = (B.vyS || 0) + ((B.y - (B.py ?? B.y)) / dt - (B.vyS || 0)) * Math.min(1, dt * 5); B.py = B.y; }
    B.tilt = Math.max(-0.17, Math.min(0.17, -(B.vyS || 0) * 0.0008));
    B.wing = (Math.sin(time * (6 + B.L)) + 1) / 2;
    B.mouth = Math.max(0, B.mouth - dt * 3);
    B.blinkT -= dt;
    if (B.blinkT <= 0) { B.blink = 0.15; B.blinkT = 1.8 + Math.random() * 2.5; }
    B.blink = Math.max(0, B.blink - dt);
    // dövüşürken arada laf atar
    if (B.phase === 'fight') {
      B.tauntT -= dt;
      if (B.taunt) { B.taunt.t += dt; if (B.taunt.t > 2.6) B.taunt = null; }
      if (B.tauntT <= 0) {
        const pool = TAUNTS[B.def.id];
        const txt = Math.random() < 0.5 ? T('taunt_main') : pool[Math.floor(Math.random() * pool.length)];
        B.taunt = { txt, t: 0 }; B.tauntT = 5 + Math.random() * 3; B.mouth = 1;
        sfx.taunt();
      }
    } else B.taunt = null;
    const midY = (H - GROUND_H) / 2 - 10;
    if (B.def.phase2 && !B.p2 && B.phase === 'fight' && B.hp < B.maxHp / 2) {   // Ayna Kraliçe 2. faz
      B.p2 = true; flash = 0.6; ebullets = []; B.fireT = 1.5;
      const pool = TAUNTS[B.def.id]; B.taunt = { txt: pool[3] || pool[0], t: 0 }; B.tauntT = 6; B.mouth = 1;
      burst(B.x, B.y, ['#ffffff', '#b07aff', '#ffd84a'], 40, 220); sfx.bossDown();
    }
    if (B.wind) {   // rüzgâr: kuşları yavaşça yukarı/aşağı iter
      B.wind.t -= dt;
      for (const b of players) if (b.alive) b.vy += B.wind.dir * 230 * dt;
      if (B.wind.t <= 0) B.wind = null;
    }
    if (B.phase === 'enter') {                      // yavaşça süzülerek girer
      B.x += (bossHomeX(B) - B.x) * Math.min(1, dt * 1.1);
      B.y += (midY - B.y) * Math.min(1, dt * 1.5);
      if (B.t > 2.8) { B.phase = 'fight'; B.t = 0; }
    } else if (B.phase === 'fight') {
      const ramp = Math.min(1, B.t / 3);            // saldırılar da yavaşça hızlanır
      B.x += (bossXTarget(B) - B.x) * Math.min(1, dt * (B.cyc === 'C' ? 2.2 : 1.2));
      const amp = Math.min(150, 85 + 6 * B.L) * (0.4 + 0.6 * ramp);
      // ilk boss düzgün dalgalanır; sonrakiler yön değiştirir, ilerledikçe hareket tahmin edilemez olur
      const u = B.L === 0 ? 0 : 0.3 + 0.7 * clamp01((B.L - 1) / 14);
      const fastK = B.cyc === 'C' ? 2.3 : 1;   // açık verme: belirgin hızlı hareket
      B.mt += dt * fastK;
      B.rT = (B.rT || 0) - dt * fastK;
      if (B.rT <= 0) {
        B.rTarget = Math.random() * 2 - 1;
        B.rT = 0.5 + Math.random() * (2.2 - 1.4 * u);
        B.rDash = Math.random() < 0.35 * u ? 3 : 1;   // ara sıra ani atılma
      }
      B.rY = (B.rY || 0) + ((B.rTarget || 0) - (B.rY || 0)) * Math.min(1, dt * fastK * (1.3 + 1.6 * u) * (B.rDash || 1));
      const wave = Math.sin(B.mt * (0.55 + 0.04 * Math.min(B.L, 19)));
      B.y = midY + amp * ((1 - u) * wave + u * B.rY);
      // ışın, özel saldırı uyarısı ya da ulti sürerken normal ateş durur: her zaman kaçış alanı kalsın
      if (!B.beam && !B.tele && !B.ultPrep && !B.ultAct && B.cyc === 'A') B.fireT -= dt * ramp;   // B ve C aşamalarında ateş yok
      if (B.fireT <= 0) { B.fireT = bossFireGap(B); bossFire(B); }
      // sıralı atışlar (nişanlı üçlü, spiral)
      for (const q of B.queue) { q.t -= dt; if (q.t <= 0) { q.f(); q.done = true; } }
      B.queue = B.queue.filter(q => !q.done);
      updateSpecial(B, dt, ramp);
      updateBossUlt(B, dt);
      // gövdesine çarpmak öldürür
      for (const b of players) {
        if (!b.alive) continue;
        if (bossCircs(B).some(([cx, cy, cr]) => (cx - b.x) ** 2 + (cy - b.y) ** 2 < (cr + hazR(b) - 6) ** 2)) killPlayer(b);
      }
    } else if (B.phase === 'dying') {
      B.y += 50 * dt; B.x += 20 * dt;
      if (Math.random() < 0.5) burst(B.x + (Math.random() - 0.5) * 50, B.y + (Math.random() - 0.5) * 50, [B.def.glow, '#ffffff', '#ffe23b', '#ff5fb4'], 6, 160);
      if (B.t > 1.8) finishBoss();
    }
  }

  function finishBoss() {
    const B = boss, p1 = players[0];
    // büyük kutlama havai fişeği
    for (let k = 0; k < 3; k++) {
      const cx = 80 + k * 100, cy = 120 + (k % 2) * 60;
      for (let i = 0; i < 50; i++) {
        const a = (i / 50) * Math.PI * 2, v = 60 + Math.random() * 90, life = 1.2 + Math.random() * 0.6;
        sparks.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: FW_COLORS[(i + k) % FW_COLORS.length], s: 2.2 });
      }
    }
    addScore(p1, 5);
    floaters.push({ x: p1.x, y: p1.y - 26, t: 0, c: '#ffe23b', txt: '+5' });
    bossCount++;
    nextBossAt = (Math.floor(p1.score / BOSS_EVERY) + 1) * BOSS_EVERY;
    // Steam başarımları
    achieve('FIRST_BOSS');
    if (B.def === BOSSES[BOSSES.length - 1]) achieve('MIRROR_QUEEN');
    const bossTotal = (parseInt(store.get('dragyBossTotal', '0'), 10) || 0) + 1;   // tüm oyunlar boyunca yenilen boss sayısı
    store.set('dragyBossTotal', bossTotal);
    if (bossTotal >= 20) achieve('BOSS_20');
    if (B.L === BOSSES.length - 1) banner(T('crown'), T('crown_sub'), '#ffe23b', 3.5);
    else if (B.L === 3) banner(T('first_crown'), T('first_crown_sub'), '#ffe23b', 3);
    else banner(T('boss_down'), T('boss_down_sub', B.name), '#ffe23b', 2.6);
    // boss sonrası kayıt
    writeSave({ score: p1.score, bossCount, nextBossAt, dist });
    hudNote(T('saved'), '#49c6ff', 2.4);
    // Pırıl: her boss sonrası kalkan
    if (qid(p1) === 'piril' && p1.alive) { p1.shield = true; sfx.shieldUp(); }
    heartPending = true;   // sonraki 25'lik bölümde bir can çıkacak
    boss = null;
    bossPhase = 'outro'; phaseT = 2.2;
  }

  function update(dt) {
    time += dt;
    if (state === 'ready' && mode === 3 && !panelOpen) updateParty(dt); else if (state !== 'ready') partyOn = false;
    flash = Math.max(0, flash - dt * 3);
    shakeT = Math.max(0, shakeT - dt);
    for (const b of players) b.wing = Math.max(0, b.wing - dt * 2.5);

    const scrolling = state !== 'dead';
    if (scrolling) {
      groundX = (groundX - speed * dt) % 24;
      cloudX = (cloudX - speed * 0.05 * dt) % W;
      hillX = (hillX - speed * 0.3 * dt) % HILL_WRAP;   // 360, 569 ve W'nin ortak katında sarılır: döşemelerde zıplama olmaz
    }
    // ~2 sütundan sonra akşam başlar, ~16. sütunda tam gece
    const nk = clamp01((dist - PIPE_SPACING * 2) / (PIPE_SPACING * 14));
    const nightTarget = (state === 'title' || state === 'menu') ? 0.92 : nk * nk * (3 - 2 * nk);
    nightT += (nightTarget - nightT) * Math.min(1, dt * 1.5);
    if (mode === 3) { setStoryTheme(storyTheme(), state === 'ready'); updateTheme(dt); }
    updateFireworks(dt, scrolling ? speed * 0.08 : 0);

    if (state === 'ready') {
      for (const b of players) {
        b.x = b.homeX; b.vx = 0; b.vy = 0;
        b.y = b.baseY + Math.sin(time * 4 + b.i * 1.7) * 8;
        b.rot = 0;
        b.wing = (Math.sin(time * 14 + b.i) + 1) / 2;
      }
    } else if (state === 'play') {
      speed = BASE_SPEED + Math.min(score, 40) * SPEED_UP;
      dist += speed * dt;
      for (const b of players) {
        b.shootCd -= dt;
        b.inv = Math.max(0, b.inv - dt);
        b.spawnT = Math.max(0, b.spawnT - dt);

        if (b.alive) {
          b.vy = Math.min(MAX_FALL * fallOf(b), b.vy + (GRAVITY * gravOf(b) + (mode === 3 ? extraAcc(b.y) : 0)) * dt);   // kara delik çekimi
          b.y += b.vy * dt;
          // itilince yavaşça kendi yerine döner
          b.vx += (b.homeX - b.x) * 2.5 * dt;
          b.vx *= Math.max(0, 1 - 2 * dt);
          b.x = Math.max(30, Math.min(W * 0.62, b.x + b.vx * dt));
          const targetRot = Math.max(-0.35, Math.min(0.9, b.vy / 230));
          b.rot += (targetRot - b.rot) * Math.min(1, dt * (targetRot < b.rot ? 8 : 2.5));
        } else {
          // ölü kuş yere düşer ve zeminle birlikte kayıp gider
          if (b.y + b.r < H - GROUND_H) {
            b.vy = Math.min(MAX_FALL * 1.3, b.vy + GRAVITY * dt);
            b.y = Math.min(H - GROUND_H - b.r, b.y + b.vy * dt);
            b.rot = Math.min(1.57, b.rot + dt * 4);
          }
          b.x -= speed * dt;
          if (mode !== 1) { b.respawnT -= dt; if (b.respawnT <= 0) respawn(b); }
        }
      }
      bumpPlayers(dt);
      updateUlts(dt);

      for (const p of pipes) {
        p.x -= speed * dt;
        if (!p.counted && p.x + PIPE_W < BX) { p.counted = true; score++; }
        if (!p.passedBy) p.passedBy = [];
        if (p.heart && !p.heart.taken) {
          const hx = p.x + PIPE_W / 2, hy = p.top + p.gap / 2 + Math.sin(time * 3) * 6;
          for (const b of players) {
            if (!b.alive) continue;
            if ((b.x - hx) ** 2 + (b.y - hy) ** 2 < 26 * 26) {
              p.heart.taken = true;
              lives = Math.min(MAX_LIVES, lives + 1);
              hudNote('+1 ❤', '#ff3b6b');
              burst(hx, hy, ['#ff3b6b', '#ff8fa3', '#ffffff'], 18, 150, 'heart');
              sfx.shieldUp();
              break;
            }
          }
        }
        for (const b of players) {
          if (!b.alive) continue;
          if (!p.passedBy.includes(b.i) && p.x + PIPE_W < b.x) { p.passedBy.push(b.i); addScore(b, 1); sfx.score(); b.ult = Math.min(100, b.ult + 6); }
          const r = b.r - 2;
          if (ultOn(b, 'lila')) continue;   // Tüy Fırtınası: sütunların içinden geçer
          if (circleRect(b.x, b.y, r, p.x, -100, PIPE_W, p.top + 100) ||
              circleRect(b.x, b.y, r, p.x, p.top + p.gap, PIPE_W, H)) killPlayer(b);
        }
      }
      if (pipes.length && pipes[0].x < -PIPE_W - 10) {
        pipes.shift();
        if (!bossPhase) addPipe(pipes[pipes.length - 1].x + PIPE_SPACING);   // boss sırasında yeni sütun yok
      }
      if (mode === 3) updateStory(dt);

      // Düşmanlar (boru boşluklarında)
      for (const e of enemies) {
        e.phase += dt * 2.2;
        if (e.free) {   // boss'un çağırdığı serbest uçan yardakçılar
          e.x -= e.vx * dt;
          e.y = e.baseY + Math.sin(e.phase) * e.amp;
        } else {
          const p = e.pipe;
          e.x = p.x + PIPE_W / 2 + Math.sin(e.phase * 0.7) * 4;
          e.y = p.top + p.gap / 2 + Math.sin(e.phase) * e.amp;
        }
        e.wing = (Math.sin(time * 10 + e.phase) + 1) / 2;
        for (const b of players) {
          if (!b.alive || ultOn(b, 'lila')) continue;
          const dx = e.x - b.x, dy = e.y - b.y, rr = b.r + e.r - 5;
          if (dx * dx + dy * dy < rr * rr) killPlayer(b);
        }
      }

      // Atışlar (sadece düşmanlara çarpar, oyuncular birbirini vuramaz)
      for (const s of shots) {
        const w = WMAP[s.w];
        if (s.delay > 0) {   // seri atışın sıradaki mermisi: kuşun ağzında bekler
          s.delay -= dt;
          const ow = players[s.owner];
          if (ow) { s.x = ow.x + 18; s.y = ow.y + 2 + (s.dy || 0); }
          if (s.delay > 0) continue;
        }
        s.t += dt;
        if (s.w === 'meteor') {   // meteor yolundaki boss mermilerini eritir
          for (const e of ebullets) if ((e.x - s.x) ** 2 + (e.y - s.y) ** 2 < (s.r + 10) ** 2) { e.dead = true; burst(e.x, e.y, ['#ff7a33', '#ffe23b'], 3, 60); }
        }
        if (w.homing) {
          let target = null, bd = Infinity;
          for (const e of enemies) {
            if (e.dead || e.x < s.x - 5) continue;
            const ex = e.x - s.x, ey = e.y - s.y;
            if (ex > w.range || Math.abs(Math.atan2(ey, ex)) > w.cone) continue;   // sadece yakın ve öndeki hedef
            const d = ex * ex + ey * ey;
            if (d < bd) { bd = d; target = e; }
          }
          if (target) {
            const cur = Math.atan2(s.vy, s.vx), want = Math.atan2(target.y - s.y, target.x - s.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const tr = w.turn * dt;
            const na = Math.max(-w.maxAng, Math.min(w.maxAng, cur + Math.max(-tr, Math.min(tr, diff))));
            const sp = Math.hypot(s.vx, s.vy);
            s.vx = Math.cos(na) * sp; s.vy = Math.sin(na) * sp;
          }
        }
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.emit -= dt;
        if (s.emit <= 0) { s.emit = 0.04; emitTrail(s); }

        for (const e of enemies) {
          if (e.dead || s.hit.includes(e)) continue;
          const dx = e.x - s.x, dy = e.y - s.y, rr = e.r + s.r;
          if (dx * dx + dy * dy < rr * rr) {
            killEnemy(e, s.w, s.owner);
            if (w.pierce) s.hit.push(e); else { s.dead = true; break; }
          }
        }
        if (!s.dead && boss && boss.phase === 'fight' && !s.hit.includes(boss)) {
          if (bossCircs(boss).some(([cx, cy, cr]) => (cx - s.x) ** 2 + (cy - s.y) ** 2 < (cr + s.r) ** 2)) {
            hurtBoss(s);
            if (w.pierce) s.hit.push(boss); else s.dead = true;
          }
        }
        if (!s.dead) for (const h of uhz) {   // vurulabilen ulti parçaları (Gölge Klonları)
          if (!h.hitR || !h.alive || h.t < 0) continue;
          if ((h.x - s.x) ** 2 + (h.y - s.y) ** 2 < (h.hitR + s.r) ** 2) {
            h.alive = false; h.end = h.t + 0.35; s.dead = true;
            burst(h.x, h.y, ['#ff3fd0', '#1c0628', '#ffffff'], 22, 170); sfx.bossHit();
            if (s.owner != null && players[s.owner]) players[s.owner].ult = Math.min(100, players[s.owner].ult + 3);
            break;
          }
        }
        if (!s.dead && !w.ghost) {   // disko topu borulardan geçer
          for (const p of pipes) {
            if (s.x + s.r > p.x - 5 && s.x - s.r < p.x + PIPE_W + 5 && (s.y - s.r * 0.5 < p.top || s.y + s.r * 0.5 > p.top + p.gap)) {
              s.dead = true;
              burst(s.x, s.y, s.w === 'kiss' ? ['#ff4d6d', '#ff8fa3'] : s.w === 'stars' ? ['#ffe066'] : s.w === 'laser' ? ['#ff5fd2', '#fff'] : RAINBOW, 10, 120, s.w === 'kiss' ? 'heart' : undefined);
              break;
            }
          }
        }
        if (s.x > W + 60 || s.y < -40 || s.y > H - GROUND_H) s.dead = true;
      }
      shots = shots.filter(s => !s.dead);
      enemies = enemies.filter(e => !e.dead && e.x > -50 && (e.free || pipes.includes(e.pipe)));

      for (const b of players) {
        if (!b.alive) continue;
        if (b.y - b.r < -40) { b.y = -40 + b.r; if (b.vy < 0) b.vy = 0; }
        if (b.y + b.r >= H - GROUND_H) {
          b.y = H - GROUND_H - b.r;
          if (b.inv > 0 || ultOn(b, 'lila')) b.vy = FLAP_V; else killPlayer(b);
        }
      }
    } else if (state === 'dead') {
      deadTimer += dt;
      for (const b of players) {
        if (b.alive) { b.wing = (Math.sin(time * 12 + b.i) + 1) / 2; b.rot *= 0.9; continue; }  // kazanan havada süzülür
        if (b.y + b.r < H - GROUND_H) {
          b.vy = Math.min(MAX_FALL * 1.3, b.vy + GRAVITY * dt);
          b.y = Math.min(H - GROUND_H - b.r, b.y + b.vy * dt);
          b.rot = Math.min(1.57, b.rot + dt * 4);
        }
      }
    }

    for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.t += dt; f.y -= 40 * dt; }
    for (const n of notes) n.t += dt;
    notes = notes.filter(n => n.t < n.dur);
    floaters = floaters.filter(f => f.t < 0.9);
  }

  // ================= ÇİZİM YARDIMCILARI =================
  function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
  function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
  function heart(g, x, y, s) {
    g.beginPath();
    g.moveTo(x, y + s);
    g.bezierCurveTo(x - s * 1.4, y, x - s * 0.7, y - s * 1.1, x, y - s * 0.4);
    g.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y, x, y + s);
    g.fill();
  }
  function starPath(g, x, y, R, r, rot) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
      g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    g.closePath();
  }

  // ---- Drag queen kuş ----
  function drawQueen(g, q, wing, dead) {
    const S = GFX.bird[q.id];
    if (S && sprReady(S.mid)) {   // 3 kare: kanat yukarı / orta / aşağı
      const im = dead ? S.down : wing > 0.6 ? S.up : wing > 0.22 ? S.mid : S.down;
      if (im.ok) {
        const w = 62, h = w * im.height / im.width;
        g.save(); g.shadowColor = q.body; g.shadowBlur = 12;
        if (dead) g.globalAlpha *= 0.75;
        g.drawImage(im, -w / 2 - 2, -h / 2 - 3, w, h); g.restore();
        if (dead) { g.strokeStyle = '#1a0b24'; g.lineWidth = 2.5; for (const s of [0, 1]) { g.beginPath(); g.moveTo(16 - 4, -9 - 4 + s * 8); g.lineTo(16 + 4, -9 + 4 - s * 8); g.stroke(); } }
        return;
      }
    }
    const O = '#1a0b24';
    g.lineJoin = 'round'; g.lineCap = 'round';

    // arka saç (uzun saç gövdenin arkasında)
    if (q.style === 'long') {
      g.fillStyle = q.hair; g.strokeStyle = q.hairLine; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(6, -14);
      g.bezierCurveTo(-4, -23, -21, -19, -23, -4);
      g.bezierCurveTo(-25, 6, -31, 12, -27, 21);
      g.bezierCurveTo(-21, 16, -17, 19, -12, 12);
      g.bezierCurveTo(-14, 3, -8, -6, 6, -14);
      g.closePath(); g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(-6, -17); g.bezierCurveTo(-16, -13, -21, 0, -24, 13); g.stroke();
      g.beginPath(); g.moveTo(-12, -12); g.bezierCurveTo(-17, -4, -17, 4, -19, 12); g.stroke();
    }

    // gövde + parlak hale (karanlık arka planda görünürlük)
    g.save(); g.shadowColor = q.body; g.shadowBlur = 16;
    g.fillStyle = q.body; ell(g, 0, 0, 18, 15); g.fill();
    g.restore();
    g.strokeStyle = O; g.lineWidth = 2.5; ell(g, 0, 0, 18, 15); g.stroke();
    g.fillStyle = q.belly; ell(g, -2, 6, 11, 7); g.fill();

    // kanat + payetler
    const wy = -2 - wing * 8;
    g.fillStyle = q.wing; ell(g, -8, wy + 3, 9, 6 - wing * 2, -0.3 - wing * 0.5); g.fill();
    g.strokeStyle = O; g.lineWidth = 2; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.85)';
    [[-11, wy + 2], [-6, wy + 4], [-9, wy + 6]].forEach(([x, y]) => { circ(g, x, y, 1); g.fill(); });

    // peruk
    g.fillStyle = q.hair; g.strokeStyle = q.hairLine; g.lineWidth = 2;
    if (q.style === 'curls') {
      const C = [[-16, -3, 7], [-13, -12, 8], [-4, -18, 9], [6, -17, 7], [13, -12, 4.5], [-19, 6, 5.5]];
      C.forEach(([x, y, r]) => { circ(g, x, y, r); g.fill(); g.stroke(); });
      g.fillStyle = q.hairHi;
      C.forEach(([x, y, r]) => { circ(g, x - r * 0.3, y - r * 0.3, r * 0.32); g.fill(); });
    } else if (q.style === 'long') {
      ell(g, -2, -12, 14, 6.5, -0.15); g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.5;
      g.beginPath(); g.arc(-3, -12, 9, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
      // saç tokası çiçek
      g.fillStyle = '#ff5fb4';
      for (let i = 0; i < 5; i++) { const a = i * 1.2566; circ(g, -11 + Math.cos(a) * 2.6, -15 + Math.sin(a) * 2.6, 1.9); g.fill(); }
      g.fillStyle = '#ffe23b'; circ(g, -11, -15, 1.5); g.fill();
    } else if (q.style === 'bouffant') {
      ell(g, -15, -2, 6, 10); g.fill(); g.stroke();
      ell(g, -3, -15, 15, 10, -0.1); g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.6;
      g.beginPath(); g.arc(-4, -15, 9, Math.PI * 1.05, Math.PI * 1.6); g.stroke();
      g.beginPath(); g.arc(-15, -2, 4, Math.PI * 0.8, Math.PI * 1.4); g.stroke();
      // taç
      g.fillStyle = '#ffd84a'; g.strokeStyle = O; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(-11, -23); g.lineTo(-8, -31); g.lineTo(-5, -25); g.lineTo(-2, -34); g.lineTo(1, -25); g.lineTo(4, -31); g.lineTo(7, -23);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#2ee68a'; circ(g, -2, -27.5, 1.8); g.fill();
      g.fillStyle = '#ff3b6b'; circ(g, -8, -26, 1.1); g.fill(); circ(g, 4, -26, 1.1); g.fill();
    } else if (q.style === 'bob') {
      // parlak, küt kesim kask saç + düz kâkül
      g.beginPath(); g.moveTo(10, -10); g.bezierCurveTo(8, -24, -18, -24, -20, -8); g.lineTo(-20, 7); g.lineTo(-10, 7); g.lineTo(-10, -9); g.lineTo(10, -9); g.closePath();
      g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.8; g.beginPath(); g.arc(-5, -12, 9, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
      g.strokeStyle = q.hairLine; g.lineWidth = 1; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-8 + k * 5, -9); g.lineTo(-8 + k * 5, -13); g.stroke(); }
    } else if (q.style === 'mohawk') {
      // alev mohawk
      const fl = Math.sin(time * 14) * 1.5;
      g.fillStyle = q.hairLine; ell(g, -2, -11, 13, 4.5, -0.1); g.fill();
      [[-14, -14, 7], [-8, -18, 9], [-1, -19, 11], [6, -17, 9]].forEach(([x, y, h], k) => {
        g.fillStyle = q.hair; g.beginPath(); g.moveTo(x - 4, y + 4); g.quadraticCurveTo(x - 3, y - h * 0.5, x + 1 + (k % 2 ? fl : -fl), y - h); g.quadraticCurveTo(x + 4, y - h * 0.4, x + 4, y + 4); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = q.hairHi; g.beginPath(); g.moveTo(x - 1.5, y + 3); g.quadraticCurveTo(x - 1, y - h * 0.3, x + 1, y - h * 0.6); g.quadraticCurveTo(x + 2, y - h * 0.2, x + 2, y + 3); g.closePath(); g.fill();
      });
    } else if (q.style === 'ponytail') {
      // yüksek at kuyruğu + kocaman fiyonk
      const sw = Math.sin(time * 6) * 3;
      g.beginPath(); g.moveTo(-8, -18); g.bezierCurveTo(-24, -26, -32 + sw, -6, -26 + sw, 10); g.bezierCurveTo(-22 + sw, -2, -18, -12, -6, -12); g.closePath(); g.fill(); g.stroke();
      ell(g, -1, -12, 13, 6, -0.1); g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-14, -18); g.bezierCurveTo(-24, -18, -26 + sw, -4, -24 + sw, 4); g.stroke();
      g.fillStyle = '#ff2e93'; g.strokeStyle = '#1a0b24'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(-8, -18); g.lineTo(-17, -25); g.lineTo(-16, -12); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-8, -18); g.lineTo(1, -26); g.lineTo(0, -13); g.closePath(); g.fill(); g.stroke();
      circ(g, -8, -18, 2.4); g.fill(); g.stroke();
    } else if (q.style === 'afro') {
      // dev afro + saç bandı
      circ(g, -4, -14, 17); g.fill(); g.stroke();
      g.fillStyle = q.hairHi; for (let k = 0; k < 10; k++) { circ(g, -4 + Math.cos(k * 2.4) * 11, -14 + Math.sin(k * 2.4) * 10, 1.4); g.fill(); }
      g.fillStyle = '#ffcf33'; g.strokeStyle = '#1a0b24'; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(-3, -6, 15, 3.4, -0.1, Math.PI, Math.PI * 2); g.lineTo(12, -6); g.lineTo(-18, -6); g.closePath(); g.fill(); g.stroke();
    } else if (q.style === 'beehive') {
      ell(g, -2, -25, 10, 14); g.fill(); g.stroke();
      ell(g, -2, -12, 15, 6); g.fill(); g.stroke();
      g.strokeStyle = q.hairHi; g.lineWidth = 1.5;
      g.beginPath(); g.arc(-2, -26, 6, Math.PI * 0.9, Math.PI * 2.1); g.stroke();
      g.beginPath(); g.arc(-2, -26, 2.5, Math.PI * 1.2, Math.PI * 2.3); g.stroke();
      g.fillStyle = '#ffffff'; g.strokeStyle = '#b9a6e0'; g.lineWidth = 0.8;
      for (let i = 0; i < 6; i++) { circ(g, -14 + i * 5, -7.5 + Math.sin(i * 0.6) * 0.8, 1.7); g.fill(); g.stroke(); }
    }

    // göz
    if (dead) {
      g.strokeStyle = O; g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(4, -9); g.lineTo(10, -3); g.moveTo(10, -9); g.lineTo(4, -3); g.stroke();
    } else {
      g.fillStyle = '#fff'; circ(g, 7, -6, 6.5); g.fill();
      g.strokeStyle = O; g.lineWidth = 2; g.stroke();
      g.strokeStyle = q.shadow; g.lineWidth = 3;
      g.beginPath(); g.arc(7, -6, 4.6, Math.PI * 1.08, Math.PI * 1.92); g.stroke();

    sh.addColorStop(0, 'rgba(20,0,40,0)'); sh.addColorStop(1, `rgba(20,0,40,${o.lo ?? 0.38})`);
    g.fillStyle = sh; g.fillRect(0, 0, S, S);

    if (o.outline) {   // belirginlik: kalın koyu dış çizgi + karakterin renginde kenar parlaması (rim light)
      let s = _offs['sil' + S]; if (!s) { s = _offs['sil' + S] = document.createElement('canvas'); s.width = s.height = S; }
      const sg = s.getContext('2d');
      const sil = (col) => { sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, S, S); sg.drawImage(c, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = col; sg.fillRect(0, 0, S, S); sg.globalCompositeOperation = 'source-over'; };
      const ow = (o.outline.w || 3.2), sc2 = R * 2 / S;
      ctx.save();

      }

  function drawSky() {
    const g = ctx, t = nightT;
    const [c0, c1, c2] = skyColors(t);
    const grd = g.createLinearGradient(0, 0, 0, H - GROUND_H);
    grd.addColorStop(0, c0); grd.addColorStop(0.55, c1); grd.addColorStop(1, c2);
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);

    // yıldızlar (gece belirir)
    const sa = clamp01((t - 0.55) / 0.35);
    if (sa > 0) {
      for (const s of STARS) {
        const x = ((s.x + cloudX) % W + W) % W;
        g.globalAlpha = sa * (0.35 + 0.65 * Math.abs(Math.sin(time * 1.3 + s.ph)));
        g.fillStyle = '#ffffff';
        g.fillRect(x, s.y, s.r, s.r);
      }
      g.globalAlpha = 1;
    }

    // güneş (batıyor)
    if (t < 0.62) {
      const k = clamp01(t / 0.58);
      const sx = W - 80, sy = 95 + k * 430;
      const col = mix('#fff3a0', '#ff7a33', k);
      const sg = g.createRadialGradient(sx, sy, 10, sx, sy, 80);
      sg.addColorStop(0, `rgba(255,${Math.round(230 - k * 90)},150,.45)`); sg.addColorStop(1, 'rgba(255,200,150,0)');
      g.fillStyle = sg; g.fillRect(sx - 90, sy - 90, 180, 180);
      g.fillStyle = col; circ(g, sx, sy, 28); g.fill();
    }

    // ay (doğuyor)
    if (t > 0.4 && state !== 'title' && state !== 'menu') {
      const k = clamp01((t - 0.4) / 0.6);
      const mx = W - 70, my = 510 - k * 418;
      const mg = g.createRadialGradient(mx, my, 10, mx, my, 70);
      mg.addColorStop(0, `rgba(255,245,200,${0.35 * k})`); mg.addColorStop(1, 'rgba(255,245,200,0)');
      g.fillStyle = mg; g.fillRect(mx - 80, my - 80, 160, 160);
      g.fillStyle = '#fdf3c4'; circ(g, mx, my, 24); g.fill();
      g.fillStyle = 'rgba(200,185,130,.5)';
      circ(g, mx - 8, my - 6, 5); g.fill(); circ(g, mx + 7, my + 8, 3.5); g.fill(); circ(g, mx + 8, my - 10, 2.5); g.fill();
    }

    // bulutlar (gündüz belirgin, akşam pembeleşip kaybolur)
    const ca = clamp01(1 - t * 1.6);
    if (ca > 0) {
      g.globalAlpha = ca * 0.9;
      g.fillStyle = mix('#ffffff', '#ffc2d9', clamp01(t * 2));
      for (let k = 0; k < 2; k++) {
        const ox = cloudX * 3 % W + k * W;
        cloudShape(g, ox + 30, 150, 1);
        cloudShape(g, ox + 190, 85, 0.8);
        cloudShape(g, ox + 280, 215, 0.6);
      }
      g.globalAlpha = 1;
    }
  }

  function drawFireworks() {
    const g = ctx;
    g.globalCompositeOperation = 'lighter';
    for (const r of rockets) { g.fillStyle = r.c; circ(g, r.x, r.y, 2); g.fill(); }
    for (const s of sparks) {
      g.globalAlpha = Math.max(0, s.life / s.max);
      g.fillStyle = s.c;
      circ(g, s.x, s.y, s.s); g.fill();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  function drawCity() {
    const g = ctx, base = H - GROUND_H;
    const bCol = nightT < 0.5 ? mix('#8fa6cf', '#4a3f7a', nightT / 0.5) : mix('#4a3f7a', '#121638', (nightT - 0.5) / 0.5);
    const winA = clamp01((nightT - 0.35) / 0.4) * 0.75;
    for (let k = 0; k < 2; k++) {
      const ox = -((-hillX) % W) + k * W;
      for (const b of BUILDINGS) {
        const bx = ox + b.x;
        if (bx > W || bx + b.w < 0) continue;
        g.fillStyle = bCol;
        g.fillRect(bx, base - b.h, b.w, b.h);
        if (b.antenna) { g.fillRect(bx + b.w / 2 - 1, base - b.h - 12, 2, 12); g.fillStyle = '#ff3b6b'; circ(g, bx + b.w / 2, base - b.h - 13, 1.6); g.fill(); }
        if (winA <= 0) continue;
        g.fillStyle = `rgba(255,215,110,${winA})`;
        for (const [wx, wy] of b.wins) g.fillRect(bx + wx, base - b.h + wy, 3, 4);
      }
    }
  }

  // ---- Simli sütun dokusu (pembe + siyah sim karışımı, bir kez üretilir) ----
  function makeGlitter(size, palette, density, base) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, size, size);
    for (let i = 0; i < size * size * density; i++) {
      const x = Math.random() * size, y = Math.random() * size, s = 1 + Math.random() * 2.2;
      g.fillStyle = palette[Math.floor(Math.random() * palette.length)];
      if (Math.random() < 0.5) g.fillRect(x, y, s, s);
      else { g.beginPath(); g.arc(x, y, s * 0.6, 0, Math.PI * 2); g.fill(); }
    }
    return ctx.createPattern(c, 'repeat');
  }
  const GLITTER_BODY = makeGlitter(96,
    ['#ff5fb4', '#ff2e93', '#ff8fcb', '#c2185b', '#111111', '#000000', '#2b2b2b', '#4a4a4a', '#ffd1ea', '#ffffff'], 0.55, '#0b0509');
  const GLITTER_LIP = makeGlitter(96,
    ['#ff5fb4', '#ff2e93', '#ff8fcb', '#ffb3dc', '#ffd1ea', '#ffffff', '#1a1a1a', '#000000'], 0.65, '#3a0a24');

  function pipeSparkles(p) {
    const list = [], lip = 26;
    for (let i = 0; i < 12; i++) {
      const topPart = i % 2 === 0;
      const y = topPart ? Math.random() * Math.max(10, p.top - lip)
                        : p.top + p.gap + lip + Math.random() * Math.max(10, H - GROUND_H - p.top - p.gap - lip);
      list.push({ x: 6 + Math.random() * (PIPE_W - 12), y, ph: Math.random() * 6.28, sp: 2 + Math.random() * 3, s: 3 + Math.random() * 3 });
    }
    return list;
  }

  function glitterRect(g, pattern, x, y, w, h, px) {
    g.save();
    g.translate(px, 0);           // doku sütunla birlikte kaysın
    g.fillStyle = pattern;
    g.fillRect(x - px, y, w, h);
    g.restore();
  }

  function drawPipe(p) {
    const g = ctx, lip = 26, lipOver = 5;
    if (!p.sparks) p.sparks = pipeSparkles(p);
    const by = p.top + p.gap, bottomH = H - GROUND_H - by - lip + 5;
    const parts = [
      { x: p.x, y: -5, w: PIPE_W, h: p.top - lip + 5, pat: GLITTER_BODY },
      { x: p.x - lipOver, y: p.top - lip, w: PIPE_W + lipOver * 2, h: lip, pat: GLITTER_LIP },
      { x: p.x - lipOver, y: by, w: PIPE_W + lipOver * 2, h: lip, pat: GLITTER_LIP },
      { x: p.x, y: by + lip, w: PIPE_W, h: bottomH, pat: GLITTER_BODY },
    ];
    // pembe ışıltı hâlesi
    g.save();
    g.shadowColor = '#ff5fb4'; g.shadowBlur = 14;
    g.fillStyle = '#0b0509';
    for (const r of parts) g.fillRect(r.x, r.y, r.w, r.h);
    g.restore();

    for (const r of parts) {
      glitterRect(g, r.pat, r.x, r.y, r.w, r.h, p.x);
      // silindir gölgesi + parlama
      const sh = g.createLinearGradient(r.x, 0, r.x + r.w, 0);
      sh.addColorStop(0, 'rgba(0,0,0,.55)');
      sh.addColorStop(0.25, 'rgba(255,150,210,.18)');
      sh.addColorStop(0.4, 'rgba(255,255,255,.22)');
      sh.addColorStop(0.55, 'rgba(0,0,0,0)');
      sh.addColorStop(1, 'rgba(0,0,0,.6)');
      g.fillStyle = sh; g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = '#ff5fb4'; g.lineWidth = 2;
      g.strokeRect(r.x, r.y, r.w, r.h);
    }
    // ağız kenarlarında ince parlak şerit
    g.fillStyle = 'rgba(255,209,234,.7)';
    g.fillRect(p.x - lipOver + 2, p.top - 4, PIPE_W + lipOver * 2 - 4, 2);
    g.fillRect(p.x - lipOver + 2, by + 2, PIPE_W + lipOver * 2 - 4, 2);

    // göz kırpan pırıltılar
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const s of p.sparks) {
      const a = Math.max(0, Math.sin(time * s.sp + s.ph));
      if (a < 0.05) continue;
      const x = p.x + s.x, y = s.y, len = s.s * a;
      g.globalAlpha = a;
      g.strokeStyle = '#ffffff'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(x - len, y); g.lineTo(x + len, y); g.moveTo(x, y - len); g.lineTo(x, y + len); g.stroke();
      g.fillStyle = '#ffb3dc'; circ(g, x, y, 1.3 * a + 0.4); g.fill();
    }

  function drawGround() {
    const g = ctx, y = H - GROUND_H;
    g.fillStyle = '#170c29'; g.fillRect(0, y, W, GROUND_H);

  // Tavan arayüzü için keskin piksel yazı: 1 px koyu dış çizgi (kalın yuvarlak çizgi yerine)
  function htext(str, x, y, size, color = '#fff', align = 'center', maxW = W - 16) {
    ctx.font = `${size}px 'Press Start 2P', monospace`;
    const mw = ctx.measureText(str).width;
    if (mw > maxW) { size = Math.max(5, size * maxW / mw); ctx.font = `${size}px 'Press Start 2P', monospace`; }
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = '#12061c';
    ctx.fillText(str, x - 1, y); ctx.fillText(str, x + 1, y); ctx.fillText(str, x, y - 1); ctx.fillText(str, x, y + 1); ctx.fillText(str, x + 1, y + 1);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  // Uzun satırı en fazla 2 satıra böler (replikler için)
  function wrap2(str, size, maxW) {
    ctx.font = `${size}px 'Press Start 2P', monospace`;
    if (ctx.measureText(str).width <= maxW) return [str];
    const words = str.split(' '); let a = '';
    for (let i = 0; i < words.length; i++) {
      const t2 = a ? a + ' ' + words[i] : words[i];
      if (ctx.measureText(t2).width > maxW && a) return [a, words.slice(i).join(' ')];
      a = t2;
    }
    return [a];
  }
  // koyu yarı saydam şerit + ince alt çizgi
  function hstrip(y, h, line = 'rgba(255,95,180,.45)') {
    ctx.fillStyle = 'rgba(10,4,20,.72)'; ctx.fillRect(0, y, W, h);
    ctx.fillStyle = line; ctx.fillRect(0, y + h - 1, W, 1);
  }
  function hbar(x, y, w, h, k, col, back = 'rgba(255,255,255,.12)') {
    ctx.fillStyle = back; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * clamp01(k)), h);
    ctx.strokeStyle = '#12061c'; ctx.lineWidth = 1; ctx.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1);
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `${size}px 'Press Start 2P', monospace`;
    // uzun çeviriler ekrana sığsın: gerekirse yazıyı küçült
    const maxW = align === 'center' ? W - 14 : (align === 'left' ? W - x - 6 : x - 6);
    const mw = ctx.measureText(str).width;
    if (mw > maxW && maxW > 20) { size = Math.max(5, size * maxW / mw); ctx.font = `${size}px 'Press Start 2P', monospace`; }
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size / 3.5);
    ctx.strokeStyle = '#1a0b24';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

    if (s >= 40) return { c: '#e5e4e2', n: T('m_plat') };

  // ---- Kötü diva boss: dev bir drag queen kafası ----
  function drawBoss(B, sc = 1, g = ctx) {
    const d = B.def, O = '#0b0710';
    // girişte yarı saydam (hasar almaz), dövüş başlayınca netleşir
    const enterA = B.phase === 'enter' ? 0.35 + 0.1 * Math.sin(time * 6) : (B.phase === 'fight' && B.t < 0.5 && !B.intro ? 0.45 + B.t * 1.1 : 1);
    const sway = Math.sin(time * 2.2) * 0.07;         // kuşlar gibi hafif salınım
    const hs = Math.sin(time * 3.1);                   // saç savrulması
    const A = bossArt(B), ph = B.L || B.def.id.length;
    g.save();
    g.globalAlpha *= Math.min(1, enterA);
    if (A) {   // resimli: yavaş süzülme, harekete göre eğilme (+ çok hafif sallanma)
      g.translate(B.x, B.y + Math.sin(time * 2.3 + ph) * 4);
      g.rotate((B.tilt || 0) + Math.sin(time * 1.7 + ph) * 0.03 + (B.phase === 'dying' ? B.t * 2 : 0));
    } else {
      g.translate(B.x, B.y + Math.sin(time * 4) * 3);
      g.rotate(sway + (B.phase === 'dying' ? B.t * 2 : 0));
    }
    g.scale(sc, sc);
    g.lineJoin = 'round'; g.lineCap = 'round';
    const SP = GFX.boss[d.id];
    if (A) {   // resimli boss: nefes alır gibi ölçek + vurulunca kırmızı/beyaz parlama
      const br = Math.sin(time * 2.6 + ph), k = ART_D / 512, x0 = -A[6] * k, y0 = -A[7] * k;
      g.scale(1 - br * 0.012, 1 + br * 0.024);
      g.drawImage(SP, x0, y0, ART_D, ART_D);
      if (B.hurt > 0.05) {
        const h = Math.min(1, B.hurt), a0 = g.globalAlpha;
        g.globalAlpha = a0 * h * 0.42; g.drawImage(tinted(SP, '#ff2440'), x0, y0, ART_D, ART_D);
        if (h > 0.6) { g.globalAlpha = a0 * FL((h - 0.6) * 1.1); g.drawImage(tinted(SP, '#ffffff'), x0, y0, ART_D, ART_D); }
        g.globalAlpha = a0;
      }
      if (B.p2) {   // Ayna Kraliçe 2. faz: sırtındaki ayna çatlar
        const mx = (282 - A[6]) * k, my = (166 - A[7]) * k;
        g.beginPath(); for (const [a, L] of [[-2.2, 13], [-0.9, 15], [0.3, 12], [1.4, 16], [2.6, 11]]) { g.moveTo(mx, my); g.lineTo(mx + Math.cos(a) * L * 0.55 + 2, my + Math.sin(a) * L * 0.55); g.lineTo(mx + Math.cos(a) * L, my + Math.sin(a) * L); }
        g.strokeStyle = 'rgba(20,8,40,.85)'; g.lineWidth = 2.6; g.stroke(); g.strokeStyle = '#ffffff'; g.lineWidth = 1.1; g.stroke();
      }
      g.restore(); return;
    }
    if (d.gen) { drawNewDiva(g, B, d, hs); g.restore(); return; }

    // ===== ARKA SAÇ =====
    g.fillStyle = d.hair; g.strokeStyle = O; g.lineWidth = 2;
    if (d.id === 'kuzgun') {
      // dev tüy yelpazesi topuz
      for (let k = -4; k <= 4; k++) {
        const a = -Math.PI / 2 + k * 0.28 + hs * 0.04;
        const L = 62 - Math.abs(k) * 4;
        g.save(); g.rotate(a + Math.PI / 2);
        g.fillStyle = d.hair;
        g.beginPath(); g.moveTo(-6, -18); g.quadraticCurveTo(-11, -18 - L * 0.6, 0, -18 - L); g.quadraticCurveTo(11, -18 - L * 0.6, 6, -18); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = d.hairHi; g.globalAlpha = 0.9;
        g.beginPath(); g.moveTo(-3, -18 - L * 0.75); g.quadraticCurveTo(0, -18 - L * 1.02, 3, -18 - L * 0.75); g.quadraticCurveTo(0, -18 - L * 0.85, -3, -18 - L * 0.75); g.fill();
        g.globalAlpha = 1;
        g.restore();
      }
      ell(g, 0, -6, 31, 36); g.fill(); g.stroke();
    } else if (d.id === 'madam') {
      // gökyüzüne uzanan gümüş topuz
      ell(g, 0, -6, 31, 36); g.fill(); g.stroke();
      ell(g, 2 + hs * 1.5, -52, 24, 30); g.fill(); g.stroke();
      ell(g, 4 + hs * 2.5, -82, 15, 18); g.fill(); g.stroke();
    } else if (d.id === 'paparazza') {
      // devasa altın-platin bukleler
      const C = [[-34, -18, 16], [-38, 4, 15], [-33, 26, 14], [34, -18, 16], [38, 4, 15], [33, 26, 14], [-24, -40, 17], [0, -50, 19], [24, -40, 17], [-26, 44, 12], [26, 44, 12]];
      C.forEach(([x, y, r], k) => { circ(g, x + Math.sin(time * 3 + k) * 1.5, y, r); g.fill(); g.stroke(); });
      g.fillStyle = d.hairHi;
      C.forEach(([x, y, r], k) => { circ(g, x - r * 0.3 + Math.sin(time * 3 + k) * 1.5, y - r * 0.3, r * 0.3); g.fill(); });
    } else if (d.id === 'golge') {
      // yere kadar dalgalanan gece moru saç
      g.beginPath();
      g.moveTo(-30, -20);
      g.bezierCurveTo(-48, 10, -42 + hs * 6, 50, -56 + hs * 10, 82);
      g.bezierCurveTo(-30 + hs * 6, 70, -10, 70, 0, 84);
      g.bezierCurveTo(10, 70, 30, 70, 56 + hs * 10, 82);
      g.bezierCurveTo(42 + hs * 6, 50, 48, 10, 30, -20);
      g.bezierCurveTo(28, -50, -28, -50, -30, -20);

    switch (tl.kind) {

        for (let y = 12; y < gyB - 8; y += 34) if (Math.abs(y - tl.gc) > 65) arrow(W - 14, y);
        g.globalAlpha = 0.8; g.strokeStyle = '#7dff6a'; g.setLineDash([]); g.lineWidth = 2;
        g.beginPath(); g.moveTo(W - 4, tl.gc - 58); g.lineTo(W - 12, tl.gc - 58); g.lineTo(W - 12, tl.gc + 58); g.lineTo(W - 4, tl.gc + 58); g.stroke();
        break; }

      case 'mirror': for (const y of tl.ys) { g.beginPath(); g.arc(ox - 24, y, 16, 0, Math.PI * 2); g.stroke(); arrow(ox - 52, y); } break;
      case 'firering': g.strokeStyle = '#ff9a3b'; g.beginPath(); g.arc(ox - 20, tl.y, 32, 0, Math.PI * 2); g.stroke(); break;
      case 'rocket': { const p = players.find(q => q.alive); if (p) { g.setLineDash([]); g.save(); g.translate(p.x, p.y); g.rotate(time * 3); g.beginPath(); g.arc(0, 0, 24, 0, Math.PI * 2); g.stroke(); for (let a = 0; a < 4; a++) { g.rotate(Math.PI / 2); g.fillRect(18, -1.5, 12, 3); } g.restore(); } break; }
      case 'saw': [-1, 1].forEach(sg => { g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox - 150, oy + sg * 135); g.stroke(); }); break;
      case 'spiral': for (let a = -0.7; a <= 0.71; a += 0.35) { g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox - Math.cos(a) * 170, oy + Math.sin(a) * 170); g.stroke(); } break;
      case 'wind': g.fillStyle = '#e6ecf8'; for (let i = 0; i < 3; i++) { const x = 40 + i * 110, y = gyB / 2; g.save(); g.translate(x, y); g.rotate(tl.dir > 0 ? -Math.PI / 2 : Math.PI / 2); arrow(0, 0, 16); g.restore(); } break;
    }

  }

  // konuşma balonu: (x,y) balonun ortası, (tx,ty) kuyruğun ucu
  function bubble(str, x, y, tx, ty, size = 7, maxW = 170) {
    ctx.font = `${size}px 'Press Start 2P', monospace`;
    // satırlara böl
    const words = str.split(' '), lines = [];
    let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    const lh = size + 5, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16, bh = lines.length * lh + 10;
    x = Math.max(bw / 2 + 4, Math.min(W - bw / 2 - 4, x));
    const bx = x - bw / 2, by = y - bh / 2;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1a0b24'; ctx.lineWidth = 2;
    roundRect(bx, by, bw, bh, 8); ctx.fill(); ctx.stroke();
    const tx0 = Math.max(bx + 10, Math.min(bx + bw - 10, tx)), ty0 = ty < by ? by : by + bh;
    ctx.beginPath(); ctx.moveTo(tx0 - 6, ty0); ctx.lineTo(tx, ty); ctx.lineTo(tx0 + 6, ty0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx0 - 6, ty0); ctx.lineTo(tx, ty); ctx.lineTo(tx0 + 6, ty0); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(tx0 - 5, ty0 + (ty < by ? 1 : -2), 10, 2);
    ctx.fillStyle = '#1a0b24'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, k) => ctx.fillText(l, x, by + 5 + lh / 2 + k * lh));
  }

  const PARTY_END = 17.5, P_ENTER = 3.4, P_MOCK = 7.0, P_KICK = 12.2, P_OUT = 13.6, P_RISE = 15.3;
