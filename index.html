<!-- Press Start 2P (SIL OFL 1.1, lisans: fonts/OFL.txt) — internetsiz çalışması için yerelden yüklenir -->
<style>
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/PressStart2P-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #07070f;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; color: #fff; }
  #wrap { position: relative; }
  /* yatay ekran: arayüz katmanları tuval ölçeğiyle (--z) büyür, böylece her pencere boyutunda aynı oranda görünür */
  .overlay, #panel, .hud-btn, #fire, #padToast { zoom: var(--z, 1); }
  .mbtns { max-width: 460px; margin: 0 auto; }
  #settings > * { max-width: 760px; margin-left: auto; margin-right: auto; }
  #settings .back { max-width: 460px; display: block; }
  canvas#c {
    display: block;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #2a1745, 0 20px 60px rgba(255, 95, 180, .18);
    cursor: pointer;
  }
  .hud-btn {
    position: absolute; top: 10px;
    height: 38px; border-radius: 10px;
    border: 2px solid #ff5fb4;
    background: rgba(26, 11, 36, .8);
    color: #fff; cursor: pointer; line-height: 1;
    font-family: inherit;
  }
  .hud-btn:focus-visible, #panel button:focus-visible { outline: 3px solid #ffe23b; outline-offset: 2px; }
  #mute { right: 10px; width: 38px; font-size: 18px; }
  #menuBtn { left: 10px; top: 54px; padding: 0 10px; font-size: 9px; }
  .overlay {
    display: none; position: absolute; inset: 0; z-index: 12; overflow-y: auto;
    padding: 22px 18px; border-radius: 12px; text-align: center;
    background: radial-gradient(ellipse at top, rgba(42,20,80,.94) 0%, rgba(11,11,30,.96) 60%, rgba(5,5,12,.98) 100%);
  }
  .overlay.open { display: block; }
  .logoSmall { font-size: 30px; line-height: 1.25; margin: 40px 0 34px; color: #ff5fb4;
    text-shadow: 0 0 14px #ff5fb4, 3px 3px 0 #1a0b24; letter-spacing: 2px; }
  .logoSmall span { color: #ffe23b; text-shadow: 0 0 14px #ffb000, 3px 3px 0 #1a0b24; }
  .mbtns { display: flex; flex-direction: column; gap: 12px; }
  .mbtns button, .overlay .back {
    font-family: inherit; font-size: 12px; color: #fff; cursor: pointer; padding: 15px 10px; border-radius: 12px;
    background: rgba(255,255,255,.05); border: 2px solid #3b2a5c; transition: transform .08s, border-color .08s, box-shadow .08s;
  }
  .mbtns button:hover, .mbtns button.focus, .overlay .back:hover { border-color: #ff5fb4; box-shadow: 0 0 16px rgba(255,95,180,.55); transform: translateX(4px); }
  .overlay .back { margin-top: 18px; width: 100%; font-size: 10px; }
  #panel .back.small { font-family: inherit; font-size: 8px; color: #fff; background: transparent; border: 2px solid #3b2a5c;
    border-radius: 8px; padding: 6px 8px; cursor: pointer; float: left; }
  .ver { position: absolute; bottom: 12px; right: 14px; font-size: 7px; color: #6a5a8a; }
  #settings { z-index: 13; }
  /* ışık hassasiyeti uyarısı: her açılışta, dokununca geçilir */
  #warn { z-index: 30; display: none; cursor: pointer; background: radial-gradient(ellipse at center, #1a0b2e 0%, #07070f 75%); }
  #warn.open { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #warn .wbox { max-width: 720px; border: 2px solid #ffe23b; border-radius: 14px; padding: 26px 30px; background: rgba(26,11,36,.85); box-shadow: 0 0 24px rgba(255,226,59,.25); }
  #warn h2 { font-size: 16px; color: #ffe23b; margin-bottom: 18px; line-height: 1.5; }
  #warn p { font-size: 9px; line-height: 2; color: #f0e6ff; }
  #warn .tap { margin-top: 22px; font-size: 8px; color: #ff9ad5; animation: wblink 1.2s infinite; }
  @keyframes wblink { 50% { opacity: .35; } }
  .row .lb2 { font-size: 7px; color: #bba9d9; min-width: 90px; text-align: left; }   /* duraklatma menüsünün üstünde açılsın */
  #settings h2 { font-size: 18px; color: #ff5fb4; text-shadow: 0 0 10px #ff5fb4, 2px 2px 0 #1a0b24; margin-bottom: 8px; }
  #settings h3 { font-size: 9px; color: #ffe23b; margin: 16px auto 8px; text-align: left; }
  .langs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .langs button, .tog { font-family: inherit; font-size: 9px; color: #fff; cursor: pointer; padding: 9px 4px; border-radius: 8px;
    background: rgba(255,255,255,.05); border: 2px solid #3b2a5c; }
  .langs button.on, .tog.on { border-color: #ff5fb4; background: rgba(255,95,180,.14); box-shadow: 0 0 10px rgba(255,95,180,.4); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row .tog { min-width: 90px; }
  .vol { display: flex; flex-direction: column; gap: 6px; flex: 1; font-size: 7px; color: #bba9d9; text-align: left; }
  .vol input { width: 100%; accent-color: #ff5fb4; }
  .ctrls { font-size: 7px; line-height: 1.9; color: #d6c8f0; text-align: left; }
  #exitBtn { display: none; left: 50%; transform: translateX(-50%); padding: 0 12px; font-size: 9px; }
  #wardrobeBtn { left: 10px; padding: 0 10px; font-size: 9px; box-shadow: 0 0 12px rgba(255,95,180,.5); }
  #fire {
    display: none;
    position: absolute; right: 14px; bottom: 14px;
    width: 62px; height: 62px; border-radius: 50%;
    border: 3px solid #ff5fb4;
    background: rgba(26, 11, 36, .85);
    font-size: 30px; line-height: 1; cursor: pointer;
    touch-action: none;
  }
  @media (pointer: coarse) { #fire { display: block; } }
  body.playing, body.playing * { cursor: none !important; }
  body.playing #exitBtn { cursor: pointer !important; }
  /* oynarken düğmeler küçülür ve tavan şeridinin sağına yerleşir; orta üst puana kalır */
  body.playing #exitBtn { left: auto; right: 42px; transform: none; top: 5px; height: 26px; padding: 0 8px; font-size: 8px; border-width: 1.5px; }
  body.playing #mute { top: 5px; right: 8px; width: 28px; height: 26px; font-size: 12px; border-width: 1.5px; }

  /* ---- Gardırop paneli ---- */
  #panel {
    display: none;
    position: absolute; inset: 0; z-index: 10;
    overflow-y: auto;
    padding: 16px 14px 18px;
    border-radius: 12px;
    background: radial-gradient(ellipse at top, #2a1450 0%, #0b0b1e 60%, #05050c 100%);
  }
  #panel.open { display: block; }
  #panel h2 {
    text-align: center; font-size: 18px; margin-bottom: 4px;
    color: #ff5fb4; text-shadow: 0 0 10px #ff5fb4, 2px 2px 0 #1a0b24;
    letter-spacing: 2px;
  }
  #panel .sub { text-align: center; font-size: 7px; color: #bba9d9; margin-bottom: 14px; line-height: 1.6; }
  #panel h3 { font-size: 10px; color: #ffe23b; margin: 10px 0 8px; text-shadow: 2px 2px 0 #1a0b24; }
  .grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #panel > *:not(.back) { max-width: 1040px; margin-left: auto; margin-right: auto; }
  .card {
    position: relative;
    background: rgba(255,255,255,.04);
    border: 2px solid #3b2a5c; border-radius: 10px;
    padding: 6px; cursor: pointer; color: #fff; font-family: inherit; text-align: center;
    transition: transform .1s, border-color .1s;
  }
  .card:hover { transform: translateY(-2px); border-color: #7a5aa8; }
  .card.sel { border-color: #ff5fb4; box-shadow: 0 0 14px rgba(255,95,180,.55); background: rgba(255,95,180,.08); }
  .card.sel::after {
    content: '✓'; position: absolute; top: 4px; right: 6px; font-size: 10px; color: #ff5fb4;
  }
  .card canvas { display: block; width: 100%; height: 76px; border-radius: 6px; }
  .card .nm { font-size: 8px; margin-top: 6px; }
  .card .tg { font-size: 6px; color: #bba9d9; margin-top: 4px; line-height: 1.5; }
  .card .pw { font-size: 7px; color: #ffe23b; margin-top: 7px; }
  .card .pwd { font-size: 6px; color: #fff; margin-top: 4px; line-height: 1.6; opacity: .85; }
  .wlist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wcard { display: grid; grid-template-columns: 104px 1fr; gap: 8px; text-align: left; align-items: center; }
  .wcard canvas { height: 52px; }
  .wcard .nm { margin-top: 0; font-size: 8px; }
  .wcard .tg { margin-top: 5px; }
  .stat { display: flex; align-items: center; gap: 4px; font-size: 6px; color: #bba9d9; margin-top: 5px; }
  .stat .lb { width: 52px; }
  .stat i { display: inline-block; width: 9px; height: 6px; background: #3b2a5c; border-radius: 1px; }
  .stat i.on { background: #ff5fb4; box-shadow: 0 0 4px #ff5fb4; }
  .modes, .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; max-width: 620px !important; }
  .modes { grid-template-columns: 1fr 1fr 1fr; }
  .modes button { font-size: 8px; padding: 10px 2px; }
  .modes button, .tabs button {
    font-family: inherit; font-size: 9px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.04); border: 2px solid #3b2a5c; border-radius: 10px; padding: 10px 4px;
    line-height: 1.7;
  }
  .modes button.on, .tabs button.on { border-color: #ff5fb4; background: rgba(255,95,180,.12); box-shadow: 0 0 12px rgba(255,95,180,.45); }
  .tabs button small { display: block; font-size: 6px; color: #bba9d9; }
  .tabs.hide { display: none; }
  .card .badge {
    position: absolute; top: 4px; left: 6px; font-size: 7px; padding: 3px 5px; border-radius: 6px; color: #1a0b24;
  }
  .card.taken { opacity: .35; cursor: not-allowed; }
  .card.taken:hover { transform: none; }
  #storyBox { display: none; margin-top: 14px; }
  #storyBox.show { display: block; }
  #lockNote { display: none; font-size: 7px; line-height: 1.7; color: #ffe23b; text-align: center; margin-bottom: 8px; }
  #lockNote.show { display: block; }
  .sbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 620px; margin: 0 auto; }
  .sbtns button { font-family: inherit; font-size: 8px; color: #fff; cursor: pointer; line-height: 1.8;
    background: rgba(255,255,255,.05); border: 2px solid #3b2a5c; border-radius: 10px; padding: 9px 4px; }
  .sbtns button small { display: block; font-size: 6px; color: #bba9d9; }
  .sbtns button.warn { border-color: #ff3b6b; color: #ff9ab0; }
  .card .sv { font-size: 6px; color: #49c6ff; margin-top: 5px; }
  .card .ul { font-size: 7px; color: #c8a8ff; margin-top: 7px; }
  #panel.m1 .card .pw, #panel.m1 .card .pwd, #panel.m1 .card .ul { display: none; }
  /* oyun kolu: seçili öğe ve takıldı/çıkarıldı bildirimi */
  .padfocus { outline: 3px solid #ffe23b !important; outline-offset: 2px; box-shadow: 0 0 14px rgba(255,226,59,.55) !important; }
  #padToast { position: absolute; left: 50%; top: 10px; z-index: 40; transform: translate(-50%, -140%); opacity: 0; visibility: hidden; transition: transform .25s, opacity .25s, visibility .25s;
    pointer-events: none; font-size: 8px; line-height: 1.6; color: #fff; text-align: center; white-space: nowrap;
    background: rgba(26, 11, 36, .92); border: 2px solid #49c6ff; border-radius: 10px; padding: 7px 12px; box-shadow: 0 0 14px rgba(73,198,255,.45); }
  #padToast small { display: block; font-size: 6px; color: #9fe3ff; }
  #padToast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  #closePanel {
    display: block; width: 100%; max-width: 460px !important; margin: 16px auto 0; padding: 12px;
    font-family: inherit; font-size: 11px; color: #1a0b24;
    background: linear-gradient(90deg, #ff5fb4, #ffe23b);
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 0 16px rgba(255,95,180,.6);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1138" height="640" aria-label="Draggy Bird"></canvas>
  <button id="menuBtn" class="hud-btn" data-i18n="hud_menu"></button>
  <button id="wardrobeBtn" class="hud-btn" data-i18n="hud_wardrobe"></button>
  <button id="mute" class="hud-btn" aria-label="Sound">🔊</button>
  <button id="exitBtn" class="hud-btn" data-i18n="hud_pause"></button>
  <button id="fire" aria-label="Fire">💥</button>
  <div id="padToast" aria-live="polite"></div>
  <!-- Işık hassasiyeti uyarısı -->
  <div id="warn" class="overlay open" role="dialog" aria-modal="true">
    <div class="wbox"><h2 data-i18n="warn_title"></h2><p data-i18n="warn_body"></p><div class="tap" data-i18n="warn_tap"></div></div>
  </div>
  <!-- Ana menü -->
  <div id="menu" class="overlay">
    <div class="logoSmall">DRAGGY<br><span>BIRD</span></div>
    <div class="mbtns">
      <button data-go="3" data-i18n="menu_story"></button>
      <button data-go="1" data-i18n="menu_1p"></button>
      <button data-go="2" data-i18n="menu_2p"></button>
      <button data-go="settings" data-i18n="menu_settings"></button>
    </div>
    <div class="ver">v1.0</div>
  </div>
  <!-- Ayarlar -->
  <div id="settings" class="overlay">
    <h2 data-i18n="set_title"></h2>
    <h3 data-i18n="set_lang"></h3>
    <div id="langs" class="langs"></div>
    <h3 data-i18n="set_sound"></h3>
    <div class="row"><button id="soundToggle" class="tog"></button>
      <label class="vol"><span data-i18n="set_volume"></span><input id="volume" type="range" min="0" max="100" step="5"></label></div>
    <div class="row" style="margin-top:8px"><label class="vol"><span data-i18n="set_music"></span><input id="musicVol" type="range" min="0" max="100" step="5"></label>
      <label class="vol"><span data-i18n="set_sfx"></span><input id="sfxVol" type="range" min="0" max="100" step="5"></label></div>
    <h3 data-i18n="set_comfort"></h3>
    <div class="row"><span class="lb2" data-i18n="set_flash"></span><button id="flashToggle" class="tog"></button></div>
    <div class="row" style="margin-top:8px"><span class="lb2" data-i18n="set_shake"></span><button id="shakeToggle" class="tog"></button>
      <label class="vol"><span data-i18n="set_shake_k"></span><input id="shakeK" type="range" min="10" max="100" step="10"></label></div>
    <h3 data-i18n="set_fullscreen"></h3>
    <div class="row"><button id="fsToggle" class="tog"></button></div>
    <h3 data-i18n="set_gfx"></h3>
    <div class="row"><button id="gfxToggle" class="tog"></button></div>
    <h3 data-i18n="set_controls"></h3>
    <div class="ctrls"><div data-i18n="ctrl_p1"></div><div data-i18n="ctrl_p2"></div><div data-i18n="ctrl_misc"></div><div data-i18n="ctrl_pad"></div></div>
    <button id="settingsBack" class="back" data-i18n="menu_back"></button>
  </div>
  <!-- Duraklatma -->
  <div id="pause" class="overlay">
    <div class="logoSmall" data-i18n="pause"></div>
    <div class="mbtns">

      case 'esma': {
        b.ultT = 0.6;
        for (const o of players) if (o !== b && o.alive && o.spawnT <= 0) {
          const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 1;
          if (d < 160) { o.vx = dx / d * 420; o.vy = Math.max(-340, Math.min(340, dy / d * 420)); o.lastHitBy = b.i; o.lastHitT = time; }
        }
        for (const e of enemies) if (!e.dead && (e.x - b.x) ** 2 + (e.y - b.y) ** 2 < 160 * 160) killEnemy(e, 'rainbow', b.i);
        ebullets.forEach(e => { if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < 160 * 160) e.dead = true; });
        break;
      }
      case 'kiraz': b.ultT = 4; break;
      case 'lila': b.ultT = 3; break;
      case 'piril': b.ultT = 4; b.inv = Math.max(b.inv, 4); break;
      case 'volkan':
        b.ultT = 0.5;
        shots.push({ owner: pi, w: 'meteor', x: b.x + 22, y: b.y, vx: 300, vy: 0, t: 0, r: 22, hit: [], emit: 0, dmg: 8 });
        break;
      case 'yasmin': {
        b.ultT = 1.2;
        for (const e of enemies) if (!e.dead && e.x > -20 && e.x < W + 20) { bolts.push({ x: e.x, y: e.y, t: 0 }); killEnemy(e, 'laser', pi); }
        ebullets.forEach(e => { e.dead = true; });
        if (boss && boss.phase === 'fight') for (let k = 0; k < 4; k++) bossQueueStrike(k * 0.22, pi);   // 4 şimşek × 1,5 = 6 hasar
        flash = 0.5;
        break;
      }
      case 'zumrut': b.ultT = 4; timeStopT = 4; break;
    }
  }

  // Yasmin'in şimşekleri: boss'a sırayla düşer
  let strikes = [];
  function bossQueueStrike(delay, pi) { strikes.push({ t: delay, pi }); }
  function updateUlts(dt) {
    timeStopT = Math.max(0, timeStopT - dt);
    for (const st of strikes) {
      st.t -= dt;
      if (st.t <= 0 && !st.done) {
        st.done = true;
        if (boss && boss.phase === 'fight') {
          bolts.push({ x: boss.x + (Math.random() - 0.5) * 30, y: boss.y, t: 0 });
          boss.hp -= 1.5; boss.hurt = 1; sfx.bossHit(); killBossCheck();
        }
      }
    }
    strikes = strikes.filter(st => !st.done);
    for (const bl of bolts) bl.t += dt;
    bolts = bolts.filter(bl => bl.t < 0.35);
    for (const b of players) {
      if (b.ultT > 0) b.ultT -= dt;
      // ulti dolumu
      if (b.alive) b.ult = Math.min(100, b.ult + dt * 100 / ULT_TIME);
    }
  }
  const ultOn = (b, id) => b.ultKind === id && b.ultT > 0;

  function shoot(pi) {
    if (panelOpen) return;
    ensureAudio();
    if (state !== 'play') return;
    const b = players[pi];
    if (!b || !b.alive || b.shootCd > 0) return;
    const w = WEAPONS[b.sel.weapon];
    b.shootCd = w.cd;
    const make = (a, dy = 0, delay = 0) => ({ owner: pi, w: w.id, x: b.x + 18, y: b.y + 2 + dy, dy, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, t: 0, r: w.r, hit: [], emit: 0, delay });
    const dbl = qid(b) === 'yasmin';   // Yasmin – Çift Atış: silahın mermisini 2 katına çıkarır
    let pattern;
    if (w.spread) pattern = dbl ? [-0.3, -0.18, -0.06, 0.06, 0.18, 0.3].map(a => [a, 0]) : [[-0.2, 0], [0, 0], [0.2, 0]];
    else pattern = (dbl && !w.burst) ? [[0, -13], [0, 13]] : [[0, 0]];   // lazer serisi ikiye katlanmaz
    const bursts = w.burst || 1;   // Simli Lazer: tek atışta 3 seri
    // mermi hasarı: silahın mermi başı hasarı; Yasmin'de mermi sayısı ikiye katlanınca yarısı (lazerde katlanmadığı için tam)
    const dmg = (w.dmg || 1) * (dbl && !w.burst ? 0.5 : 1);
    for (let k = 0; k < bursts; k++) pattern.forEach(([a, dy]) => { const m = make(a, dy, k * 0.07); m.dmg = dmg; shots.push(m); });
    sfx[w.id]();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (warnOpen()) return;
    if (state === 'title') { ensureAudio(); openMenu(); return; }
    if (paused) return;
    if (e.button === 2) shoot(mousePlayer());
    else if (e.button === 1) useUlt(mousePlayer());   // orta tık / tekerlek tıkı: ulti
    else flap(mousePlayer());
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('auxclick', (e) => e.preventDefault());
  fireBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); shoot(mousePlayer()); });
  fireBtn.addEventListener('contextmenu', (e) => e.preventDefault());
  // Klavye: 1. oyuncu SPACE/W zıpla · F ateş · D ulti — 2. oyuncu Sağ Shift zıpla · Ş ateş · L ulti
  const isP2Fire = (e) => e.code === 'Semicolon' || e.key === 'ş' || e.key === 'Ş';
  window.addEventListener('keydown', (e) => {
    if (overlayOpen('settings')) { if (e.code === 'Escape') closeSettings(); return; }
    if (overlayOpen('menu')) { menuKey(e, 'menu'); return; }
    if (overlayOpen('pause')) { if (e.code === 'Escape') { e.preventDefault(); resume(); } else menuKey(e, 'pause'); return; }
    if (warnOpen()) { e.preventDefault(); closeWarn(); return; }
    if (state === 'title') { e.preventDefault(); openMenu(); return; }
    if (panelOpen) {
      if (e.code === 'Escape') closePanel();
      return;
    }
    if (e.code === 'Escape') {
      e.preventDefault();
      if (state === 'play') pauseGame(); else openMenu();
      return;
    }
    if (paused) return;
    // GEÇİCİ TEST TUŞU (Steam'den önce kaldırılacak): K = boss'u öldür / boss yoksa hemen sonraki boss'u getir
    if (DEBUG_KEYS && e.code === 'KeyK' && mode === 3 && state === 'play') {
      if (boss && boss.phase !== 'dying') { boss.hp = 0; killBossCheck(); }
      else if (!bossPhase) { players[0].score = Math.max(players[0].score, nextBossAt); score = players[0].score; }
      return;
    }
    const p2 = mode === 2 ? 1 : 0;   // tek kişilikte 2. oyuncu tuşları da 1. oyuncuyu yönetir
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) flap(0);
    } else if (e.code === 'ShiftRight') {
      e.preventDefault();
      if (!e.repeat) flap(p2);
    } else if (e.code === 'KeyF') {
      e.preventDefault();
      shoot(0);
    } else if (isP2Fire(e)) {
      e.preventDefault();
      shoot(p2);
    } else if (e.code === 'KeyD') {
      e.preventDefault();
      if (!e.repeat) useUlt(0);
    } else if (e.code === 'KeyL') {
      e.preventDefault();
      if (!e.repeat) useUlt(p2);
    } else if (e.code === 'KeyR' && mode === 3 && state !== 'play' && !(state === 'dead' && deadTimer < 0.6)) {
      writeSave(null);   // kaydı sil, hikayeye baştan başla
      runActive = false;
      reset(); state = 'ready';
      sfx.select();
    } else if (e.code === 'KeyG' && state !== 'play') {
      openPanel();
    }
  });

  // ================= EFEKTLER =================
  function burst(x, y, colors, n, spd, shape) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.35, color: colors[i % colors.length], size: shape === 'heart' ? 3 + Math.random() * 2.5 : 2 + Math.random() * 3, shape });
    }
  }

  function emitTrail(s) {
    const rnd = (a) => a[Math.floor(Math.random() * a.length)];
    switch (s.w) {
      case 'kiss': particles.push({ x: s.x - 10, y: s.y + (Math.random() - 0.5) * 8, vx: -30, vy: -20 - Math.random() * 20, life: 0.5, color: rnd(['#ff4d6d', '#ff8fa3', '#e8002d']), size: 3, shape: 'heart' }); break;
      case 'stars': particles.push({ x: s.x - 6, y: s.y, vx: -40, vy: (Math.random() - 0.5) * 40, life: 0.35, color: rnd(['#ffe066', '#fff6c2']), size: 1.8 }); break;
      case 'laser': for (let i = 0; i < 2; i++) particles.push({ x: s.x - 10 - Math.random() * 20, y: s.y + (Math.random() - 0.5) * 6, vx: -20, vy: (Math.random() - 0.5) * 50, life: 0.3, color: rnd(['#ff5fd2', '#ffffff', '#ffb3ec']), size: 1.4 }); break;
      case 'disco': particles.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, life: 0.4, color: rnd(RAINBOW), size: 1.8 }); break;
    }
  }

  function killEnemy(e, wid, owner) {
    e.dead = true;
    const shooter = players[owner];
    if (shooter) { addScore(shooter, 1); shooter.ult = Math.min(100, shooter.ult + 4); }
    floaters.push({ x: e.x, y: e.y - 10, t: 0, c: shooter ? QUEENS[shooter.sel.queen].body : '#ffe23b' });
    if (wid === 'kiss') burst(e.x, e.y, ['#ff1744', '#ff4d6d', '#ff8fa3', '#ffffff'], 18, 200, 'heart');
    else if (wid === 'stars') burst(e.x, e.y, ['#ffe066', '#fff6c2', '#ffb000', '#8cff4a'], 22, 220);
    else if (wid === 'laser') burst(e.x, e.y, ['#ff5fd2', '#ffffff', '#ffb3ec', '#8cff4a'], 22, 240);
    else burst(e.x, e.y, RAINBOW.concat(['#8cff4a', '#ffffff']), 22, 220);
    sfx.pop();
  }

  // ---- Havai fişekler ----
  function updateFireworks(dt, drift) {
    fwTimer -= dt;
    if (fwTimer <= 0 && nightT > 0.75) {
      fwTimer = 1.8 + Math.random() * 1.8;
      rockets.push({ x: 30 + Math.random() * (W - 60), y: H - GROUND_H - 20, vx: (Math.random() - 0.5) * 30, vy: -(270 + Math.random() * 120), ty: 60 + Math.random() * 210, c: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)] });
    }
    for (const r of rockets) {
      r.x += r.vx * dt - drift * dt;
      r.y += r.vy * dt;
      r.vy += 70 * dt;
      if (Math.random() < 0.6) sparks.push({ x: r.x, y: r.y + 3, vx: (Math.random() - 0.5) * 15, vy: 20, life: 0.35, max: 0.35, c: '#ffd9a0', s: 1.2 });
      if (r.y <= r.ty || r.vy > -50) {
        r.dead = true;
        const ring = Math.random() < 0.35;
        const c2 = Math.random() < 0.5 ? FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)] : r.c;
        const n = 45 + Math.floor(Math.random() * 30);
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + Math.random() * 0.1;
          const v = ring ? 105 + Math.random() * 10 : 30 + Math.random() * 120;
          const life = 1.1 + Math.random() * 0.7;
          sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: i % 2 ? c2 : r.c, s: 2.2 });
        }
      }
    }
    rockets = rockets.filter(r => !r.dead);
    const drag = Math.max(0, 1 - 1.3 * dt);
    for (const s of sparks) {
      s.vx *= drag; s.vy = s.vy * drag + 60 * dt;
      s.x += s.vx * dt - drift * dt; s.y += s.vy * dt;
      s.life -= dt;
    }
    sparks = sparks.filter(s => s.life > 0);
  }

  // ================= GÜNCELLEME =================
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw)), ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function killPlayer(b) {
    if (state !== 'play' || !b.alive || b.inv > 0) return;
    if (b.shield) {   // Bella: Sprey Kalkanı darbeyi emer
      b.shield = false; b.inv = 1.3;
      if (b.y + b.r >= H - GROUND_H - 2) b.vy = FLAP_V;
      b.lastHitBy = -1;
      burst(b.x, b.y, ['#ff5fb4', '#ffc6e4', '#ffffff', '#49c6ff'], 24, 200);
      sfx.shield();
      return;
    }
    b.alive = false;
    b.vx = 0;
    sfx.hit(); sfx.die();
    if (mode === 3) {
      lives--;
      lostHeartT = 1;
    }
    if (mode === 1 || (mode === 3 && lives <= 0)) {
      flash = 1;
      if (b.score > best) { best = b.score; store.set('flappyBest', best); newBest = true; }
      state = 'dead'; deadTimer = 0;
      return;
    }
    // 2 kişilik / hikaye: ölen geri gelir; yakın zamanda iten oyuncu +5 alır
    flash = 0.45;
    b.deaths++;
    b.respawnT = qid(b) === 'lila' ? RESPAWN_TIME / 2 : RESPAWN_TIME;   // Lila 1 sn'de doğar
    if (b.lastHitBy >= 0 && time - b.lastHitT < KILL_WINDOW) {
      const killer = players[b.lastHitBy];
      const gain = KILL_BONUS;
      addScore(killer, gain);
      floaters.push({ x: killer.x, y: killer.y - 26, t: 0, c: QUEENS[killer.sel.queen].body, txt: '+' + gain });
      burst(killer.x, killer.y, ['#ffe23b', '#ffffff', QUEENS[killer.sel.queen].body], 16, 160);
      sfx.kill();
    }
    b.lastHitBy = -1;
  }

  function addScore(b, n) {
    b.score += n;
    if (b.score >= 100) achieve('SCORE_100');
    if (b.score > best) { best = b.score; store.set('flappyBest', best); newBest = true; }
    if (mode === 2 && b.score >= WIN_SCORE && state === 'play') {
      state = 'dead'; deadTimer = 0; flash = 1;
      sfx.win();
    }
  }

  // Çıkış: oyunu o anki skorlarla bitirir, sonuç ekranına geçer
  function endGame() {
    if (state !== 'play') return;
    for (const b of players) if (b.score > best) { best = b.score; store.set('flappyBest', best); newBest = true; }
    state = 'dead'; deadTimer = 0;
    sfx.select();
  }
  exitBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
  exitBtn.addEventListener('click', (e) => { e.stopPropagation(); pauseGame(); exitBtn.blur(); });

  function respawn(b) {
    let next = null;
    for (const p of pipes) if (p.x + PIPE_W > b.homeX - 10 && (!next || p.x < next.x)) next = p;
    b.alive = true;
    b.x = b.homeX; b.vx = 0; b.vy = 0; b.rot = 0;
    b.y = next ? next.top + next.gap / 2 : H * 0.4;
    b.inv = INVULN_TIME;
    b.spawnT = INVULN_TIME;
    b.lastHitBy = -1;
    // Bella: kalkan sadece doğarken, iki ölümde bir gelir
    if (qid(b) === 'bella' && b.deaths % 2 === 0) { b.shield = true; sfx.shieldUp(); }
    if (qid(b) === 'piril') { b.shield = true; sfx.shieldUp(); }   // Pırıl: her doğuşta kalkan
    burst(b.x, b.y, [QUEENS[b.sel.queen].body, '#ffffff', '#ffe23b'], 20, 150);
    sfx.respawn();
  }

  // İki kuş çarpışınca ölmez. DEĞEN kuş yerinde kalır, DEĞİLEN kuş temas doğrultusunda fırlar:
  // öndeki arkadakine değerse arkadaki geri, arkadaki öndekine değerse öndeki ileri,
  // alttan değen üsttekini yukarı, üstten değen alttakini aşağı atar.
  function bumpPlayers(dt) {
    bumpCd -= dt;
    if (players.length < 2) return;
    const [a, c] = players;
    if (!a.alive || !c.alive) return;
    // doğarken (yanıp sönerken) ne iter ne itilir; doğuş bitince çarpışma başlar
    if (a.spawnT > 0 || c.spawnT > 0) return;
    const dx = c.x - a.x, dy = c.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01, min = a.r + c.r - 2;
    if (d >= min) return;
    const nx = dx / d, ny = dy / d;            // a'dan c'ye doğru
    // Kim kime doğru hareket ediyor? (temas doğrultusundaki yaklaşma hızları)
    const aApproach = a.vx * nx + a.vy * ny;    // a, c'ye doğru ne kadar hızlı
    const cApproach = -(c.vx * nx + c.vy * ny); // c, a'ya doğru ne kadar hızlı
    if (aApproach + cApproach <= 0 && d > min - 4) return; // zaten ayrılıyorlar

    let hitter, target, ux, uy, approach;      // (ux,uy): hedefin fırlayacağı yön
    if (aApproach >= cApproach) { hitter = a; target = c; ux = nx; uy = ny; approach = aApproach; }
    else { hitter = c; target = a; ux = -nx; uy = -ny; approach = cApproach; }
    // ulti sırasında itilemeyen (Kiraz hücumu, Lila tüy fırtınası) itilen olamaz
    const solid = (x) => ultOn(x, 'kiraz') || ultOn(x, 'lila');
    if (solid(target) && !solid(hitter)) { [hitter, target] = [target, hitter]; ux = -ux; uy = -uy; approach = Math.max(aApproach, cApproach); }
    if (solid(target) && solid(hitter)) return;

    // üst üste binmeyi sadece hedefi iterek çöz (değen yerinde kalır)
    const ov = min - d;
    target.x += ux * ov; target.y += uy * ov;

    // hedef temas doğrultusunda fırlar
    const PUSH = 160;
    let j = PUSH + Math.max(0, approach) * 0.6;
    if (qid(hitter) === 'esma') j *= 1.4;   // Esma – Saç Savurma: sert iter
    if (qid(target) === 'esma') j *= 0.8;   // ...ve %20 daha zor itilir (simülasyonla dengelendi)
    if (qid(target) === 'lila') j *= 0.65;  // Lila – Tüy Topuz: itişlerin bir kısmını savuşturur

    if (qid(hitter) === 'kiraz') j *= 1.6;  // Kiraz – Kızıl Öfke: en sert itiş
    if (ultOn(hitter, 'kiraz')) j *= 2;     // Kızıl Hücum ultisi
    if (qid(hitter) === 'lila') j *= 1.3;   // Lila de sert iter
    target.vx = ux * j;
    target.vy = uy * j;
    // değenin temas yönündeki hızı sıfırlanır (içinden geçmesin), başka bir şey olmaz
    const hn = hitter.vx * ux + hitter.vy * uy;
    if (hn > 0) { hitter.vx -= hn * ux; hitter.vy -= hn * uy; }

    const clampV = (v) => Math.max(-440, Math.min(440, v));
    target.vx = clampV(target.vx); target.vy = clampV(target.vy);

    target.lastHitBy = hitter.i; target.lastHitT = time;
    hitter.ult = Math.min(100, hitter.ult + 8);

    if (bumpCd <= 0) {
      bumpCd = 0.15;
      sfx.bump();
      const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
      burst(mx, my, [QUEENS[hitter.sel.queen].body, '#ffffff'], 10, 110);
    }
  }

  // ================= HİKAYE MODU & BOSSLAR =================
  function banner(text, sub, color, dur = 2.6) { banners = [{ text, sub, color, t: 0, dur }]; }

  const BOSS_SC = 1.2, BOSS_R = 41;   // bosslar %20 büyük; çarpışma yarıçapı da (34 → 41) — çizim (klasik) modu
  const ART_K = ART_D * BOSS_SC / 512;   // dövüşte görselin 512 uzayından ekrana çarpanı
  // çarpışma daireleri: resimliyse gövde + kafa, klasik çizimde eski tek daire
  function bossCircs(B) {
    const A = bossArt(B);
    if (!A) return [[B.x, B.y, B.r]];
    return [[B.x, B.y, A[8] * ART_K], [B.x + (A[3] - A[6]) * ART_K, B.y + (A[4] - A[7]) * ART_K, A[5] * ART_K]];
  }
  // durduğu x: resimli bossun kuyruğu ekrandan taşmasın (salınım payı 8 px)
  function bossHomeX(B) { const A = bossArt(B); return A ? Math.min(W - 84, W - 14 - (A[9] - A[6]) * ART_K) : W - 84; }
  // yatay gezinme hedefi: normal aşamada x 700..sağ kenar; açık vermede 600'e kadar gelir (vurmak kolaylaşır);
  // daraltma ultisi hazırlanırken ve sürerken sağda sabit. Kuşa hiçbir zaman ~400 px'ten fazla yaklaşmaz.
  function bossXTarget(B) {
    const hi = bossHomeX(B);
    if (B.ultPrep || B.ultAct) return hi;
    const lo = Math.max(BX + 372, B.cyc === 'C' ? 600 : 700);
    const u = 0.5 + 0.5 * Math.sin(B.mt * 0.37 + 1.3) * Math.cos(B.mt * 0.11 + B.L);
    return lo + (hi - lo) * u;
  }
  // mermi hızının yatay çarpanı: boss uzaklaştıkça mermi hızlanır
  const bossSPX = (B) => Math.max(1, Math.min(4.5, (bossMouth(B)[0] - BX) / 165));   // kuşa varış ~0,8-1 sn (eski dikey ekrana yakın)
  // mermi çıkış noktası: gaga ucu
  function bossMouth(B) { const A = bossArt(B); return A ? [B.x + (A[1] - A[6]) * ART_K, B.y + (A[2] - A[7]) * ART_K] : [B.x - 40, B.y + 4]; }
  // "!" işaretinin yeri: kafanın üstü
  function bossHeadTop(B) { const A = bossArt(B); return A ? [B.x + (A[3] - A[6]) * ART_K, B.y + (A[4] - A[7] - A[5] * 1.45) * ART_K] : [B.x, B.y - 62]; }
  function makeBoss(L) {
    const def = BOSSES[L % BOSSES.length];
    const encore = Math.floor(L / BOSSES.length);
    // daha yavaş güçlenme: 22 can ile başlar, her boss +6 (12. boss ~88)
    // 20 boss boyunca +6, sonra (★ tekrarları) her boss +3
    const hp = Math.round((22 + Math.min(L, 19) * 6 + Math.max(0, L - 19) * 3) * BOSS_TUNE[Math.min(L, 19)][4]);
    return {
      L, def, name: def.name + (encore ? ' ' + '★'.repeat(encore) : ''),
      x: W + 90, y: (H - GROUND_H) / 2, hp, maxHp: hp, r: BOSS_R,
      t: 0, phase: 'enter', fireT: 1.2, specT: 3.2, hurt: 0, beam: null, tele: null, wing: 0, queue: [], spin: 0,
      mouth: 0, blink: 0, blinkT: 2, taunt: null, tauntT: 2.5,
      ultG: 0, ultMax: cycTimes(L).A, ultPrep: 0, ultAct: null, ultN: 0, cyc: 'A', openT: 0, openMax: 1, mt: 0,
    };
  }

  function killBossCheck() {
    if (boss.hp <= 0 && boss.phase !== 'dying') {
      boss.phase = 'dying'; boss.t = 0; boss.beam = null; boss.tele = null; boss.ultAct = null; boss.ultPrep = 0; uhz = [];
      ebullets = [];
      flash = 0.8; sfx.bossDown();
    }
  }

  function hurtBoss(s) {
    const shooter = players[s.owner];
    const dmg = s.dmg || (s.w === 'meteor' ? 8 : 1);
    boss.hp -= dmg;
    boss.hurt = 1;
    if (shooter) shooter.ult = Math.min(100, shooter.ult + 1.5 * Math.min(1, dmg));   // ulti dolumu hasarla orantılı (3'lü atış ultiyi 3 kat doldurmasın)
    // Volkan – Yakıcı Ateş: boss 3 sn yanar (meteor: 5 sn)
    if (shooter && qid(shooter) === 'volkan') boss.burn = Math.max(boss.burn || 0, s.w === 'meteor' ? 5 : 3);
    burst(s.x, s.y, [boss.def.glow, '#ffffff'], 5, 90);
    sfx.bossHit();
    killBossCheck();
  }

  // Boss gücü 12 boss boyunca yavaşça artar
  // ===== BOSS ZORLUK TABLOSU (ortalama botla ölçülerek ayarlandı) =====
  // her boss için: [ateş aralığı (sn), mermi hızı çarpanı, desen yoğunluğu 0..1, normal aşama süresi (sn), can çarpanı]
  // ★ tekrarlarında (L ≥ 20) ateş biraz sıklaşır, hız ve yoğunluk hafifçe artar.
  const BOSS_TUNE = [
    [0.38, 1.60, 0.53, 9.00, 1.70], [0.38, 1.60, 0.51, 8.70, 1.70], [0.39, 1.49, 0.46, 7.70, 1.68], [0.38, 1.60, 0.59, 8.60, 1.70],
    [0.39, 1.59, 0.65, 8.90, 1.69], [0.38, 1.41, 0.56, 7.60, 1.60], [0.38, 1.53, 0.69, 8.20, 1.70], [0.48, 1.23, 0.54, 6.80, 1.37],
    [0.49, 1.21, 0.59, 6.70, 1.36], [0.47, 1.23, 0.65, 7.10, 1.37], [0.62, 1.09, 0.61, 6.20, 1.21], [0.46, 1.23, 0.75, 7.00, 1.36],
    [0.43, 1.23, 0.81, 7.30, 1.38], [0.65, 1.05, 0.73, 6.30, 1.17], [0.42, 1.24, 0.93, 7.40, 1.39], [0.59, 1.07, 0.85, 6.60, 1.19],
    [0.60, 1.06, 0.89, 6.70, 1.18], [0.63, 1.02, 0.91, 6.50, 1.14], [0.64, 1.00, 0.95, 6.30, 1.12], [0.69, 0.97, 0.97, 6.40, 1.07],
  ];
  const bossTune = (B) => BOSS_TUNE[Math.min(B.L, 19)];
  const bossEnc = (B) => Math.floor(B.L / BOSSES.length);
  const bossVol = (B) => Math.min(1.3, bossTune(B)[2] + 0.06 * bossEnc(B));   // desen yoğunluğu
  const bossSpeed = (B) => Math.min(290, (150 + 5 * Math.min(B.L, 19) + Math.max(0, B.L - 19)) * bossTune(B)[1]);
  const bossFireGap = (B) => Math.max(0.62, bossTune(B)[0] * Math.pow(0.97, bossEnc(B)));

  // Takip eden mermi kuralı: gerçek kilitlenen füze yok. En fazla 0,8 sn hafifçe yönelir,
  // kuşun dikey hızı eşiği geçince (zıplama ya da hızlı dalış) takibi hemen bırakır.
  const HOME_MAX = 0.8, HOME_BREAK_VY = 165;
  function shootBullet(B, x, y, vx, vy, extra) {
    ebullets.push(Object.assign({ x, y, vx, vy, r: 7, rot: Math.atan2(vy, vx), kind: B.def.bullet, t: 0 }, extra || {}));
  }

  // Özel saldırılar: bekleme süreli (6-9 sn), 1 sn önceden haber verilir; arada sadece normal atışlar
  const SPECIALS = ['beam', 'cross', 'bolt', 'curtain', 'meteors', 'bubble', 'rocket', 'saw', 'firering', 'mirror', 'spiral', 'wind'];
  // Her boss'un kendine özgü normal atışları (kolaydan zora); özel saldırılar (ışın, perde, baloncuk…) tanımdaki listeden gelir
  const NORMAL_SETS = {
    kuzgun: ['straight', 'double', 'fan'], madam: ['double', 'fan', 'stream'], paparazza: ['fan', 'burst', 'straight'],
    golge: ['aimed', 'burst', 'stream'], kristal: ['ring', 'split', 'aimed'], sarmasik: ['wave', 'arc', 'fan'],
    disko: ['ring', 'zigzag', 'double'], medusa: ['aimed3', 'helix', 'wave'], siber: ['stream', 'burst', 'fan'],
    vampir: ['aimed3', 'boomer', 'ring', 'wave'], firavun: ['drop', 'wave', 'burst'], elmas: ['aimed3', 'ring', 'split', 'fan'],
    siren: ['wave', 'helix', 'aimed'], bonbon: ['lolly', 'fan', 'zigzag'], sirk: ['pins', 'boomer', 'aimed'],
    mekanika: ['double', 'stream', 'zigzag'], mantar: ['potion', 'wisp', 'arc', 'fan'], kozmik: ['ring', 'aimed3', 'split'],
    firtina: ['fan', 'aimed', 'zigzag'], ayna: ['aimed3', 'split', 'fan', 'helix'],
  };
  const NORMAL_SETS_P2 = { ayna: ['ring', 'wave', 'boomer', 'drop'] };
  const bossAtks = (B) => {
    const base = (B.def.phase2 && B.p2) ? B.def.phase2 : B.def.attacks;
    const norm = (B.p2 && NORMAL_SETS_P2[B.def.id]) || NORMAL_SETS[B.def.id] || base.filter(a => !SPECIALS.includes(a));
    return base.filter(a => SPECIALS.includes(a)).concat(norm);
  };
  const specialGap = () => 6 + Math.random() * 3;

  function bossFire(B, special, prm) {
    const sp0 = bossSpeed(B), sp = sp0 * bossSPX(B), vol = bossVol(B);   // sp: yatay hız (mesafeyle ölçekli), sp0: dikey bileşenler
    const [ox, oy] = bossMouth(B);
    const target = players.find(p => p.alive);
    // öngörülü nişan: kuşun dikey hızına göre biraz ileriyi hedefler (yoğunlukla artar; ekran dışına taşmaz)
    const aimAt = () => { if (!target) return Math.PI; const T = Math.abs(target.x - ox) / Math.max(120, bossSpeed(B) * bossSPX(B)), lead = 0.25 + 0.5 * Math.min(1, bossVol(B));
      const ty = Math.max(30, Math.min(gyB - 30, target.y + target.vy * T * lead)); return Math.atan2(ty - oy, target.x - ox); };
    const shots = bossAtks(B).filter(a => !SPECIALS.includes(a));
    const gyB = H - GROUND_H;
    const kind = special || shots[Math.floor(Math.random() * shots.length)] || 'straight';
    prm = prm || {};
    B.mouth = 1;   // ateş ederken ağzını açar
    switch (kind) {
      case 'straight': { const a = aimAt(); shootBullet(B, ox, oy, Math.cos(a) * sp, Math.sin(a) * sp); break; }   // nişanlı tek
      case 'double': { const a = aimAt(); [-15, 15].forEach(d => shootBullet(B, ox, oy + d, Math.cos(a) * sp, Math.sin(a) * sp)); break; }   // nişanlı çift (paralel)
      case 'spread3': [-0.22, 0, 0.22].forEach(a => shootBullet(B, ox, oy, -Math.cos(a) * sp, Math.sin(a) * sp0 * 0.6)); break;
      // --- yeni normal desenler (yoğunluk vol ile artar; her birinde kaçış boşluğu kalır) ---
      case 'fan': { const n = vol >= 0.45 ? 5 : 3, a0 = aimAt() - Math.PI; for (let i = 0; i < n; i++) { const a = (i - (n - 1) / 2) * 0.2; shootBullet(B, ox, oy, -sp, (Math.sin(a) * 0.6 + Math.sin(a0) * 0.5) * sp0); } break; }
      case 'stream': { const n = 4 + Math.round(vol * 2), a = aimAt(); for (let k = 0; k < n; k++) B.queue.push({ t: k * 0.09, f: () => shootBullet(B, ...bossMouth(B), Math.cos(a) * sp, Math.sin(a) * sp) }); break; }
      case 'burst': { const a = aimAt(); [-0.07, 0, 0.07].forEach(d => shootBullet(B, ox, oy, Math.cos(a + d) * sp, Math.sin(a + d) * sp)); break; }
      case 'split': { const a = aimAt(); shootBullet(B, ox, oy, Math.cos(a) * sp * 0.6, Math.sin(a) * sp * 0.6, { r: 10, split: 0.85, splitN: vol >= 0.5 ? 5 : 3, splitV: sp0 * 0.85 }); break; }
      case 'arc': { const n = 2 + (vol >= 0.5 ? 1 : 0); for (let k = 0; k < n; k++) shootBullet(B, ox, oy, -sp * (0.45 + 0.12 * k), -sp0 * (0.55 + 0.25 * Math.random()), { grav: 230 }); break; }
      case 'zigzag': [-1, 1].forEach(sg => shootBullet(B, ox, oy + sg * 10, -sp * 0.75, 0, { zig: 0.32, zigV: sg * (110 + 60 * vol) })); break;
      case 'helix': for (let k = 0; k < 2 + Math.round(vol); k++) B.queue.push({ t: k * 0.22, f: () => { const [mx, my] = bossMouth(B); [-1, 1].forEach(sg => shootBullet(B, mx, my, -sp * 0.8, 0, { baseY: my, amp: 42, freq: 6, ph: sg > 0 ? 0 : Math.PI })); } }); break;
      case 'boomer': [-1, 1].forEach(sg => shootBullet(B, ox, oy + sg * 40, -sp * 1.05, sg * sp0 * 0.12, { ax: sp * 0.75, life: 3.4, r: 9 })); break;
      case 'drop': { const n = 4 + Math.round(vol * 2), x0 = BX - 120, span = Math.min(B.x - 140, 760) - x0, gap = Math.floor(Math.random() * n);
        for (let k = 0; k < n; k++) if (k !== gap) shootBullet(B, x0 + span * (k + 0.5) / n + (Math.random() - 0.5) * 20, -14, -sp0 * 0.05, sp0 * (0.6 + 0.15 * vol)); break; }
      case 'aimed': { const a = aimAt(); shootBullet(B, ox, oy, Math.cos(a) * sp, Math.sin(a) * sp); break; }
      case 'aimed3': for (let k = 0; k < 3; k++) B.queue.push({ t: k * 0.2, f: () => { const a = aimAt(); shootBullet(B, ...bossMouth(B), Math.cos(a) * sp, Math.sin(a) * sp); } }); break;
      case 'ring': { const n = 8 + Math.round(vol * 4); for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + B.t; shootBullet(B, B.x, B.y, Math.cos(a) * sp0 * 0.9, Math.sin(a) * sp0 * 0.9); } break; }
      case 'wave': [-1, 1].forEach(sg => shootBullet(B, ox, oy, -sp * 0.85, 0, { baseY: oy, amp: 32, freq: 5, ph: sg > 0 ? 0 : Math.PI })); break;
      case 'rain': for (let k = 0; k < 7; k++) { const x = BX - 140 + Math.random() * (B.x - 110 - BX + 140); shootBullet(B, x, -12, -sp0 * 0.08, sp0 * 0.55); } break;
      case 'bubble': {   // 5 şeritten 3'ü dolu: en az 2 boş kaçış şeridi
        const lanes = prm.lanes || [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5).slice(0, 3);
        lanes.forEach((l, i) => shootBullet(B, ox, 70 + l * (gyB - 140) / 4, -sp * 0.42, 0, { kind: 'bubble', r: 13, baseY: 70 + l * (gyB - 140) / 4, amp: 8, freq: 2 + i, ph: i }));
        break; }
      case 'lolly': { const a = aimAt(); shootBullet(B, ox, oy, Math.cos(a) * sp * 0.65, Math.sin(a) * sp * 0.65, { kind: 'lolly', r: 11, ph: Math.random() });
        [-0.35, 0.35].forEach(d2 => shootBullet(B, ox, oy, -Math.cos(d2) * sp * 0.7, Math.sin(d2) * sp0 * 0.42, { kind: 'candy' })); break; }
      case 'curtain': case 'meteors': {   // tek boşluklu duvar: boşluk her zaman 130 px
        const gc = prm.gc != null ? prm.gc : 100 + Math.random() * (gyB - 200), drop = kind === 'meteors' ? sp0 * 0.1 : 0;
        for (let y = 12; y < gyB - 8; y += 34) if (Math.abs(y - gc) > 65) shootBullet(B, ox + (kind === 'meteors' ? (y - gc) * 0.15 : 0), y - (drop ? 30 : 0), -sp * 0.55, drop, kind === 'meteors' ? { kind: 'meteor' } : null);
        break; }
      case 'pins': for (let k = 0; k < 3; k++) B.queue.push({ t: k * 0.18, f: () => shootBullet(B, ...bossMouth(B), -sp * (0.5 + Math.random() * 0.25), -sp0 * (0.35 + Math.random() * 0.4), { kind: 'pin', grav: 300 }) }); break;
      case 'firering': shootBullet(B, ox, prm.y != null ? prm.y : Math.max(70, Math.min(gyB - 70, oy)), -sp * 0.5, 0, { kind: 'firering', ring: 32, r: 36 }); break;
      case 'rocket': { const a = aimAt(); shootBullet(B, ox, oy, Math.cos(a) * sp * 0.7, Math.sin(a) * sp * 0.7, { kind: 'rocket', home: 0.9, homeT: 0.8 }); break; }
      case 'saw': [-1, 1].forEach(sg => shootBullet(B, ox, oy, -sp * 0.5, sg * sp0 * 0.45, { kind: 'saw', r: 10, bounce: true })); break;
      case 'potion': [0.25, 0.55].forEach(v => shootBullet(B, ox, oy, -sp * 0.6, -sp0 * v, { kind: 'potion', grav: 260 })); break;
      case 'wisp': shootBullet(B, ox, oy, -sp * 0.4, 0, { kind: 'wisp', home: 0.8, homeT: 0.8, life: 4.5, r: 8 }); break;
      case 'wind': B.wind = { dir: prm.dir || (Math.random() < 0.5 ? -1 : 1), t: 1.8 }; shootBullet(B, ox, oy, -sp, 0); break;
      case 'mirror': (prm.ys || [-55, 55].map(dy => Math.max(60, Math.min(gyB - 60, oy + dy)))).forEach((y0, i) => { shootBullet(B, ox, y0, -sp * 0.55, 0, { kind: 'mirror', r: 11, baseY: y0, amp: 22, freq: 3, ph: i * Math.PI }); }); break;
      case 'spiral': for (let k = 0; k < 7; k++) B.queue.push({ t: k * 0.09, f: () => { B.spin += 0.55; const a = Math.PI + Math.sin(B.spin) * 0.7; shootBullet(B, ...bossMouth(B), Math.cos(a) * sp * 0.8, Math.sin(a) * sp0 * 0.5); } }); break;
    }
    sfx.bossShot();
  }

  // Özel saldırıyı 1 sn önceden duyur: parametreler şimdi seçilir, uyarı işareti tam o yeri gösterir
  function startSpecial(B, kind) {
    const tgt = players.find(p => p.alive), gyB = H - GROUND_H, midY = gyB / 2 - 10;
    const y0 = tgt ? tgt.y : midY;
    const tl = { kind, t: 0, dur: 1.0 };
    switch (kind) {
      case 'beam': case 'cross': {
        const ys = kind === 'cross' ? [Math.max(40, y0 - 85), Math.min(gyB - 30, y0 + 85)] : [y0];
        B.beam = { ys, t: 0, fired: false }; tl.beam = true; break; }
      case 'bolt': {   // yıldırım: ekranın bir yarısı, diğer yarı güvenli
        const top = y0 < gyB / 2;
        const split = top ? Math.max(150, Math.min(gyB - 120, y0 + 75)) : Math.max(120, Math.min(gyB - 150, y0 - 75));
        B.beam = { bolt: true, x: tgt ? tgt.x : BX, top, split, t: 0, fired: false, seed: Math.random() * 100 }; tl.beam = true; break; }
      case 'curtain': case 'meteors': tl.gc = 100 + Math.random() * (gyB - 200); break;
      case 'bubble': tl.lanes = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5).slice(0, 3); break;
      case 'mirror': tl.ys = [-55, 55].map(dy => Math.max(60, Math.min(gyB - 60, B.y + 4 + dy))); break;
      case 'firering': tl.y = Math.max(70, Math.min(gyB - 70, B.y + 4)); break;
      case 'wind': tl.dir = Math.random() < 0.5 ? -1 : 1; break;
    }
    B.tele = tl;
    sfx.tele();
  }

  function updateSpecial(B, dt, ramp) {
    if (B.beam) {   // uyarılı ışın / çapraz / yıldırım
      B.beam.t += dt;
      if (B.beam.t > 1.0 && !B.beam.fired) { B.beam.fired = true; sfx.beam(); }
      if (B.beam.fired && B.beam.t < 1.45) {
        if (B.beam.bolt) { const bb = B.beam; for (const b of players) if (b.alive && Math.abs(b.x - bb.x) < 14 + hazR(b) - 4 && (bb.top ? b.y < bb.split : b.y > bb.split)) killPlayer(b); }
        else for (const b of players) for (const by of B.beam.ys) if (b.alive && Math.abs(b.y - by) < 10 + hazR(b) - 4 && b.x < B.x) killPlayer(b);
      }
      if (B.beam.t > 1.6) B.beam = null;
    }
    if (B.tele) {
      B.tele.t += dt;
      if (B.tele.t >= B.tele.dur) {
        const tl = B.tele; B.tele = null;
        if (!tl.beam) bossFire(B, tl.kind, tl);
        B.fireT = Math.max(B.fireT, ['curtain', 'meteors', 'bubble'].includes(tl.kind) ? 1.4 : 0.8);   // duvardan sonra kısa nefes
        B.specT = specialGap();
      }
      return;
    }
    if (B.beam || B.ultPrep || B.ultAct || B.cyc !== 'A') return;
    const pool = bossAtks(B).filter(a => SPECIALS.includes(a));
    if (!pool.length) return;
    B.specT -= dt * ramp;
    if (B.specT <= 0) startSpecial(B, pool[Math.floor(Math.random() * pool.length)]);
  }

  // ================= BOSS DÖVÜŞ DÖNGÜSÜ =================
  // Her dövüş, boss ölene kadar dönen 3 aşamadır:
  //  A) NORMAL: boss normal hareket eder, normal atışlarını ve özel saldırılarını yapar; ulti çubuğu dolar.
  //  B) DARALTMA (boss'un ultisi): 1,5 sn hazırlık, sonra tavandan ve/veya zeminden gelen temalı duvarlar
  //     uçuş alanını daraltır. Boss ATEŞ ETMEZ. Koridor en dar haliyle 110 px; yavaşça kayar, ani sıçrama yapmaz.
  //  C) AÇIK VERME: boss belirgin hızlı hareket eder, ateş etmez ("!" + ince parlama); çubuk yeniden dolunca A'ya döner.
  // Tehlikeler zamana bağlı yazılır: kill(x, y, r, tt) ileriye dönük tahmin (bot) için de kullanılır.
  function cycTimes(L, p2) {   // A ve C süreleri (sn); Ayna Kraliçe'nin 2. fazında döngü hızlanır
    const k = Math.min(L, 19), enc = Math.floor(L / BOSSES.length), f = Math.max(0.72, Math.pow(0.92, enc));
    const late = Math.max(0, k - 14);   // son bosslar uzun dövüşür: döngüleri de uzun
    return { A: BOSS_TUNE[k][3] * f * (p2 ? 0.75 : 1), C: (2.4 + 0.2 * k + 0.2 * late) * (p2 ? 0.8 : 1) };
  }
  let uhz = [];   // ulti tehlikeleri: { t, end, own, kill?, draw?, upd?, hitR?/alive? }
  function addHz(U, h, delay = 0) { h.t = -delay; h.own = U; if (h.end == null) h.end = 99; uhz.push(h); return h; }
  function updateHz(dt) {
    if (timeStopT <= 0) for (const h of uhz) { h.t += dt; if (h.upd && h.t >= 0) h.upd(dt, h); }
    for (const h of uhz) if (h.kill && h.t >= 0) for (const b of players) if (b.alive && h.kill(b.x, b.y, hazR(b) - 5, h.t, h)) killPlayer(b);
    uhz = uhz.filter(h => h.t < h.end);
  }
  // Ekstra dikey ivme (çekim alanları için) — oyuncu güncellemesine ve bot tahminine eklenir
  function extraAcc(y) {
    let a = 0;
    for (const h of uhz) if (h.pull && h.t >= h.pullFrom && h.t <= h.pullTo) a += Math.sign(h.y - y) * h.pull * Math.min(1, Math.abs(h.y - y) / 40);
    return a;
  }
  function updateBossUlt(B, dt) {
    if (B.cyc === 'C') {   // açık verme: çubuk yeniden dolana kadar
      B.openT += dt;
      if (B.openT >= B.openMax) { B.cyc = 'A'; B.ultG = 0; B.ultMax = cycTimes(B.L, B.p2).A; B.fireT = Math.max(B.fireT, 0.5); B.specT = Math.max(B.specT, 2.2); }
      return;
    }
    if (B.ultAct) {
      const U = B.ultAct; U.t += dt;
      for (const ev of U.ev) if (!ev.done && U.t >= ev.t) { ev.done = true; ev.f(); }
      if (U.t >= U.dur && !uhz.some(h => h.own === U)) { B.ultAct = null; B.ultG = 0; startOpen(B); }
      return;
    }
    if (B.ultPrep > 0) {
      B.ultPrep -= dt;
      if (Math.random() < 0.6) particles.push({ x: B.x + (Math.random() - 0.5) * 70, y: B.y + (Math.random() - 0.5) * 70, vx: 0, vy: -40, life: 0.4, color: B.def.glow, size: 2.5 });
      if (B.ultPrep <= 0) { B.ultPrep = 0; startBossUlt(B); }
      return;
    }
    if (B.tele || B.beam) return;
    B.ultG += dt;
    if (B.ultG >= B.ultMax) {
      B.ultPrep = 1.5; B.cyc = 'B';
      banner(T('ult_go'), B.def.ultName.toUpperCase(), B.def.glow, 2.6);
      sfx.bossUlt(); flash = Math.max(flash, 0.25);
      B.taunt = null; B.mouth = 1;
    }
  }
  function startBossUlt(B) {
    for (const e of ebullets) burst(e.x, e.y, ['#ffffff', B.def.glow], 3, 60);   // daraltmada mermi yok
    ebullets = []; B.queue = []; B.wind = null;
    const U = { t: 0, dur: 4, ev: [] };

  // ---- daraltma çizimi
  function drawSqueeze(g, h, tt) {

  function sqSide(g, S, xs, es, top, tt, gy, v, glow) {

        g.fillStyle = '#ffffff'; circ(g, x - 5, y - 1, 2); circ(g, x + 4, y - 3, 1.6); g.fill(); } } },
