      const justLost = i === lives && lostHeartT > 0;
      ctx.globalAlpha = justLost ? 0.4 + 0.6 * Math.abs(Math.sin(time * 20)) : 1;
      ctx.fillStyle = i < lives ? '#ff3b6b' : (justLost ? '#ffffff' : 'rgba(255,255,255,.14)');
      heart(ctx, 16 + i * 14, 9, justLost ? 5 + lostHeartT * 3 : 5);
      ctx.strokeStyle = '#12061c'; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (mode === 3 && p1.alive) {   // oyuncunun ultisi
      const full = p1.ult >= 100;
      if (full && !p1.ultReadyPlayed) { p1.ultReadyPlayed = true; sfx.ultReady(); }
      if (!full) p1.ultReadyPlayed = false;
      hbar(10, 23, 62, 5, p1.ult / 100, full ? (Math.sin(time * 10) > 0 ? '#ffe23b' : '#ffffff') : '#a06ad0');
      htext(full ? T('ult_d') : T('ult'), 77, 26, 5, full ? '#ffe23b' : '#d6c8f0', 'left', 70);
    }
    htext(String(p1.score), W / 2, 13, 14, '#ffffff');   // puan
    if (mode === 3 && !boss && !bossPhase) {   // sıradaki boss'a ilerleme
      const prev = nextBossAt - BOSS_EVERY, k = clamp01((p1.score - prev) / BOSS_EVERY);
      hbar(W / 2 - 34, 26, 68, 3, k, '#ff5fb4');
    }
    let y = 34;
    if (mode === 3 && boss && boss.phase !== 'dying') {   // boss şeridi
      const B = boss;
      hstrip(y, 30, B.def.glow);
      const bx = W / 2 - 330, bw = 660;   // boss çubuğu ortada
      htext(B.name.toUpperCase(), bx, y + 8, 7, B.def.glow, 'left', 330);
      hbar(bx, y + 15, bw, 6, B.hp / B.maxHp, B.def.glow);
      if (B.ultMax) {   // boss ulti çubuğu
        const open = B.cyc === 'C';
        const k = open ? B.openT / B.openMax : B.ultAct ? Math.max(0, 1 - B.ultAct.t / B.ultAct.dur) : B.ultPrep ? 1 : B.ultG / B.ultMax, hot = !open && (k >= 1 || B.ultAct);
        hbar(bx, y + 24, bw, 2, k, open ? '#ffe23b' : hot ? (Math.sin(time * 18) > 0 ? '#ffffff' : '#ff3b6b') : '#ff7ad9', 'rgba(255,255,255,.08)');
        htext(open ? T('boss_open') : T('boss_ult'), bx + bw, y + 8, 5, open ? '#ffe23b' : hot ? '#ffffff' : '#ff9ad5', 'right', 110);
      }
      y += 30;
    }
    drawNotes(y);
    if (mode === 3 && boss && boss.taunt) drawTalkDots(boss);   // konuşan boss'un yanında küçük "…" balonu
  }

  // Duyurular, kısa notlar ve boss repliği: tek şerit, üst üste binmeden
  function drawNotes(y) {
    const lines = [];
    for (const bn of banners) {
      const a = Math.max(0, Math.min(1, bn.t / 0.3, (bn.dur - bn.t) / 0.4));
      lines.push({ txt: bn.text, c: bn.color, s: 8, a });
      if (bn.sub) wrap2(bn.sub, 6, 760).forEach(l => lines.push({ txt: l, c: '#ffffff', s: 6, a }));
    }
    for (const n of notes) {
      const a = Math.max(0, Math.min(1, n.t / 0.2, (n.dur - n.t) / 0.4));
      lines.push({ txt: n.txt, c: n.color, s: 7, a });
    }
    if (timeStopT > 0) lines.push({ txt: '⏳ ' + timeStopT.toFixed(1), c: '#c8ffe4', s: 7, a: 1 });
    if (mode === 3 && boss && boss.taunt && !banners.length) {
      const a = Math.max(0, Math.min(1, boss.taunt.t / 0.2, (2.6 - boss.taunt.t) / 0.3));
      wrap2('"' + boss.taunt.txt + '"', 6, 760).forEach(l => lines.push({ txt: l, c: '#ffffff', s: 6, a }));
    }
    if (!lines.length) return;
    const lh = (s) => s + 5, h = lines.reduce((sum, l) => sum + lh(l.s), 0) + 6;
    ctx.globalAlpha = Math.max(...lines.map(l => l.a));
    hstrip(y, h, 'rgba(255,255,255,.25)');
    let yy = y + 3;
    for (const l of lines) {
      ctx.globalAlpha = l.a;
      htext(l.txt, W / 2, yy + lh(l.s) / 2, l.s, l.c);
      yy += lh(l.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawTalkDots(B) {
    const a = Math.max(0, Math.min(1, B.taunt.t / 0.2, (2.6 - B.taunt.t) / 0.3));
    const x = Math.round(B.x - 46), y = Math.round(Math.max(110, B.y - 40));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#12061c'; ctx.lineWidth = 1.5;
    roundRect(x - 13, y - 7, 26, 14, 5); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 6, y + 6); ctx.lineTo(x + 16, y + 13); ctx.lineTo(x + 10, y + 5); ctx.fill();
    ctx.fillStyle = '#12061c';
    for (let k = 0; k < 3; k++) { const on = Math.floor(time * 6) % 3 >= k; ctx.globalAlpha = a * (on ? 1 : 0.3); ctx.fillRect(x - 7 + k * 6, y - 1, 3, 3); }
    ctx.globalAlpha = 1;
  }

  function drawUltFx(b) {
    if (!b.alive) return;
    const g = ctx;
    // Zümrüt Aura (boss savaşında görünür halka)
    if (qid(b) === 'zumrut' && (boss || ebullets.length)) {
      g.save(); g.strokeStyle = 'rgba(46,230,138,.45)'; g.lineWidth = 2; g.setLineDash([6, 6]); g.lineDashOffset = -time * 20;
      circ(g, b.x, b.y, ZUMRUT_AURA); g.stroke();
      g.fillStyle = 'rgba(46,230,138,.06)'; g.fill(); g.restore();
    }
    if (ultOn(b, 'piril')) {   // Elmas Kubbe
      g.save(); g.shadowColor = '#bfefff'; g.shadowBlur = 16;
      g.strokeStyle = 'rgba(191,239,255,.9)'; g.lineWidth = 3;
      g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + time; g.lineTo(b.x + Math.cos(a) * 42, b.y + Math.sin(a) * 42); } g.closePath(); g.stroke();
      g.fillStyle = 'rgba(191,239,255,.15)'; g.fill();
      g.restore();
    }
    if (ultOn(b, 'kiraz')) {   // Kızıl Hücum: alev halkası
      for (let k = 0; k < 8; k++) {
        const a = time * 6 + k * 0.785;
        g.fillStyle = k % 2 ? '#ff4a1c' : '#ffb000';
        circ(g, b.x + Math.cos(a) * 24, b.y + Math.sin(a) * 22, 3.5 + Math.sin(time * 20 + k)); g.fill();
      }
    }
    if (ultOn(b, 'lila') && Math.random() < 0.5) particles.push({ x: b.x - 10, y: b.y + (Math.random() - 0.5) * 20, vx: -60, vy: (Math.random() - 0.5) * 30, life: 0.5, color: '#efe4ff', size: 2.5 });
    if (b.ultKind === 'esma' && b.ultT > 0) {   // Saç Kasırgası şok dalgası
      const k = 1 - b.ultT / 0.6;
      g.save(); g.strokeStyle = `rgba(46,230,214,${1 - k})`; g.lineWidth = 6 * (1 - k) + 1; circ(g, b.x, b.y, 20 + 140 * k); g.stroke(); g.restore();
    }
  }

  function drawPlayers() {
    // önce ölüler, üstte yaşayanlar (kuşların üstünde yazı yok)
    for (const b of [...players].sort((u, v) => u.alive - v.alive)) {
      if (b.x < -40) continue;
      if ((state === 'ready' && mode === 3) || state === 'title' || state === 'menu') continue;   // giriş ekranlarında kuş ayrıca çiziliyor
      safe(ctx, 'kuş', () => {
        let al = 1;
        if (b.inv > 0) al = 0.35 + 0.65 * (Math.sin(time * 25) > 0 ? 1 : 0);
        if (ultOn(b, 'lila')) al *= 0.55;   // hayalet
        if (b.alive) groundShadow(b.x, b.y, 16);
        shaded(44, b.x, b.y, (g) => { g.translate(b.x, b.y); g.rotate(b.rot); drawQueen(g, QUEENS[b.sel.queen], b.wing, !b.alive); }, { alpha: al });
        drawUltFx(b);
        if (b.alive && b.shield) {   // Sprey Kalkanı balonu
          ctx.save();
          const pr = 27 + Math.sin(time * 5) * 1.5;
          const sg = ctx.createRadialGradient(b.x, b.y, pr * 0.55, b.x, b.y, pr);
          sg.addColorStop(0, 'rgba(255,95,180,0)'); sg.addColorStop(1, 'rgba(255,150,210,.35)');
          ctx.fillStyle = sg; circ(ctx, b.x, b.y, pr); ctx.fill();
          ctx.strokeStyle = 'rgba(255,198,228,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,.8)'; circ(ctx, b.x - pr * 0.45, b.y - pr * 0.5, 2.5); ctx.fill();
          ctx.restore();
        }
      });
    }
  }

  function render() {
    const d0 = ctx.__d || 0;
    ctx.save();
    { const s = (OPT.shake ? OPT.shakeK : 0) * Math.max(flash > 0.5 ? 4 : 0, shakeT > 0 ? shakeA * shakeT / shakeD : 0);   // ekran sarsıntısı
      if (s > 0.05) ctx.translate((Math.random() - 0.5) * 2 * s, (Math.random() - 0.5) * 2 * s); }
    const themed = mode === 3 && state !== 'title' && state !== 'menu';
    if (themed) safe(ctx, 'tema', drawStoryBG);
    else { safe(ctx, 'gökyüzü', drawSky); safe(ctx, 'havai fişek', drawFireworks); safe(ctx, 'şehir', drawCity); }
    if (bossTint > 0.01) { ctx.fillStyle = `rgba(120,0,70,${0.2 * bossTint})`; ctx.fillRect(0, 0, W, H - GROUND_H); }
    if (state === 'play' || state === 'dead') for (const p of pipes) safe(ctx, 'sütun', () => (p.theme && THEMES[p.theme]) ? drawThemedPipe(p) : drawPipe(p));
    for (const p of pipes) if (p.heart && !p.heart.taken) safe(ctx, 'can', () => {   // toplanabilir can
      const hx = p.x + PIPE_W / 2, hy = p.top + p.gap / 2 + Math.sin(time * 3) * 6, sz = 9 + Math.sin(time * 6) * 1.2;
      ctx.save(); ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff3b6b'; heart(ctx, hx, hy, sz);
      ctx.shadowBlur = 0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; circ(ctx, hx - sz * 0.4, hy - sz * 0.35, sz * 0.18); ctx.fill();
      ctx.restore();
    });
    safe(ctx, 'zemin', themed ? drawThemedGround : drawGround);
    for (const e of enemies) safe(ctx, 'düşman', () => shaded(50, e.x, e.y, (g) => (e.theme && THEMES[e.theme]) ? drawThemedEnemy(e, g) : drawEnemy(e, g), { blur: 6 }));
    for (const sh of shots) if (!(sh.delay > 0)) safe(ctx, 'ateş', () => drawProj(ctx, sh));
    if (mode === 3) safe(ctx, 'boss', drawBossStuff);
    safe(ctx, 'parçacık', drawParticles);
    drawPlayers();
    if (state !== 'title' && state !== 'menu') safe(ctx, 'vinyet', () => {   // kenarları karartan sinematik vinyet
      const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.45, H * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.38)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    });
    safe(ctx, 'ulti', () => {
      if (timeStopT > 0) {   // Zaman Durdur
        const a = Math.min(1, timeStopT, 4 - timeStopT + 0.001);
        ctx.fillStyle = `rgba(46,230,138,${0.12 * a})`; ctx.fillRect(0, 0, W, H - GROUND_H);
        ctx.strokeStyle = `rgba(200,255,228,${0.5 * a})`; ctx.lineWidth = 2;
        for (let k = 0; k < 3; k++) { circ(ctx, W / 2, (H - GROUND_H) / 2, 60 + k * 70 + (time * 30) % 70); ctx.stroke(); }
      }
      for (const bl of bolts) {   // şimşekler
        ctx.save(); ctx.globalAlpha = (1 - bl.t / 0.35) * (OPT.lessFlash ? 0.5 : 1); ctx.shadowColor = '#fff6c2'; ctx.shadowBlur = OPT.lessFlash ? 4 : 14;
        ctx.strokeStyle = '#fff6c2'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(bl.x + 10, -10);
        for (let yy = 0; yy < bl.y; yy += 28) ctx.lineTo(bl.x + (Math.random() - 0.5) * 24, yy);
        ctx.lineTo(bl.x, bl.y); ctx.stroke();
        ctx.restore();
      }
    });
    safe(ctx, 'yazı', () => {
      for (const f of floaters) { ctx.globalAlpha = 1 - f.t / 0.9; htext(f.txt || '+1', f.x, f.y, f.txt ? 10 : 8, f.c || '#ffe23b'); }   // sadece küçük +1/+5 sayıları
    });
    while ((ctx.__d || 0) > d0) ctx.restore();
    ctx.globalAlpha = 1;
    safe(ctx, 'arayüz', drawUI);
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${FL(flash * 0.8)})`; ctx.fillRect(0, 0, W, H); }
    // bir hata olduysa küçük bir uyarı göster (bana iletebilmen için)
    if (lastErr && lastErrT > 0) {
      ctx.font = "6px 'Press Start 2P', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(4, H - 16, W - 8, 12);
      ctx.fillStyle = '#ff6b6b'; ctx.fillText('⚠ ' + lastErr.slice(0, 70), 8, H - 6);
    }
  }

  // ================= GARDIROP PANELİ =================
  const queenCards = [], weaponCards = [];
  function setupCanvas(cv, w, h) {
    const d = DPR();
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    const g = cv.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    return g;
  }
  function bars(n) { let s = ''; for (let i = 1; i <= 5; i++) s += `<i class="${i <= n ? 'on' : ''}"></i>`; return s; }

  const qWrap = document.getElementById('queens');
  QUEENS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.setAttribute('aria-label', q.name);
    b.innerHTML = `<canvas></canvas><div class="info"></div><div class="sv"></div>`;
    b.addEventListener('click', () => {
      if (mode === 3) {
        if (!q.story || (runActive && i !== storySel.queen)) return;   // oyun sürerken kuş değişmez
        storySel.queen = i; store.set('dragyStoryQueen', q.id);
        loadSave(); reset(); state = 'ready';
        ensureAudio(); sfx.select(); refreshSel();
        return;
      }
      const other = sel[1 - edit];
      if (mode === 2 && other.queen === i) return;      // diğer oyuncunun kraliçesi
      sel[edit].queen = i; store.set('flappyQueen' + (edit + 1), q.id);
      ensureAudio(); sfx.select(); refreshSel();
    });
    qWrap.appendChild(b);
    queenCards.push({ b, cv: b.querySelector('canvas'), g: null });
  });
  const wWrap = document.getElementById('weapons');
  WEAPONS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'card wcard';
    b.setAttribute('aria-label', w.name);
    b.innerHTML = `<canvas></canvas><div class="info"></div>`;
    b.addEventListener('click', () => {
      if (mode === 3) { storySel.weapon = i; store.set('dragyStoryWeapon', w.id); }
      else { sel[edit].weapon = i; store.set('flappyWeapon' + (edit + 1), w.id); }
      ensureAudio(); sfx[w.id](); refreshSel();
    });
    wWrap.appendChild(b);
    weaponCards.push({ b, cv: b.querySelector('canvas'), g: null });
  });

  let edit = 0;   // panelde düzenlenen oyuncu
  const modeBtns = [...document.querySelectorAll('#modes button')];
  const tabBtns = [...document.querySelectorAll('#tabs button')];
  modeBtns.forEach(btn => btn.addEventListener('click', () => {
    mode = parseInt(btn.dataset.mode, 10);
    store.set('flappyMode', mode);
    runActive = false;
    reset(); state = 'ready';   // oyuncu sayısı hemen güncellensin
    if (mode !== 2) edit = 0;
    ensureAudio(); sfx.select(); refreshSel();
  }));
  tabBtns.forEach(btn => btn.addEventListener('click', () => {
    edit = parseInt(btn.dataset.p, 10);
    ensureAudio(); sfx.select(); refreshSel();
  }));

  // kart metinleri (dil değişince yeniden yazılır)
  function fillCardTexts() {
    queenCards.forEach((c, i) => {
      const q = QUEENS[i], U = ULTS[q.id];
      c.b.setAttribute('aria-label', q.name);
      c.b.querySelector('.info').innerHTML = `<div class="nm" style="color:${q.body}">${q.name}</div><div class="tg">${q.tag}</div><div class="pw">${q.power.icon} ${q.power.name}</div><div class="pwd">${q.power.desc}</div><div class="ul">${U.icon} ${T('ult_card')}: ${U.name}</div><div class="pwd">${U.desc}</div>`;
    });
    weaponCards.forEach((c, i) => {
      const w = WEAPONS[i];
      c.b.setAttribute('aria-label', w.name);
      c.b.querySelector('.info').innerHTML = `<div class="nm">${w.icon} ${w.name}</div><div class="tg">${w.trait}</div>
        <div class="stat"><span class="lb">${T('stat_speed')}</span>${bars(w.stats.hiz)}</div>
        <div class="stat"><span class="lb">${T('stat_rate')}</span>${bars(w.stats.siklik)}</div>
        <div class="stat"><span class="lb">${T('stat_power')}</span>${bars(w.stats.guc)}</div>`;
    });
  }

  function refreshSel() {
    modeBtns.forEach(btn => btn.classList.toggle('on', parseInt(btn.dataset.mode, 10) === mode));
    document.getElementById('tabs').classList.toggle('hide', mode !== 2);
    panel.classList.toggle('m1', mode === 1);   // 1 oyunculuda güç ve ulti yazıları gizli
    tabBtns.forEach(btn => {
      const pi = parseInt(btn.dataset.p, 10);
      btn.classList.toggle('on', pi === edit);
      btn.style.color = QUEENS[sel[pi].queen].body;
    });
    const target = mode === 3 ? storySel : sel[edit];
    document.getElementById('storyBox').classList.toggle('show', mode === 3);
    document.getElementById('lockNote').classList.toggle('show', mode === 3 && runActive);
    document.getElementById('switchBird').style.display = runActive ? '' : 'none';
    queenCards.forEach((c, i) => {
      const q = QUEENS[i];
      c.b.style.display = (mode === 1 || (mode === 3) === !!q.story) ? '' : 'none';
      const sv = c.b.querySelector('.sv');
      if (mode === 3 && q.story) { const r = readSave(i); sv.textContent = r ? T('save_info', r.score, r.bossCount) : T('save_none'); }
      else sv.textContent = '';
      c.b.classList.toggle('sel', i === target.queen);
      c.b.classList.toggle('taken', (mode === 2 && i === sel[1 - edit].queen) || (mode === 3 && runActive && i !== storySel.queen));
      let badge = c.b.querySelector('.badge');
      const owner = mode === 2 ? [0, 1].find(pi => sel[pi].queen === i) : (target.queen === i ? 0 : undefined);
      if (owner === undefined) { if (badge) badge.remove(); return; }
      if (!badge) { badge = document.createElement('span'); badge.className = 'badge'; c.b.appendChild(badge); }
      badge.textContent = mode === 2 ? T('badge_player', owner + 1) : T('badge_sel');
      badge.style.background = owner === 0 ? '#ffe23b' : '#49c6ff';
    });
    weaponCards.forEach((c, i) => c.b.classList.toggle('sel', i === target.weapon));
    if (panelOpen) setupPreviews();
  }
  // Kuş değiştir: oyunu bırakır, kayıtlar durur
  document.getElementById('switchBird').addEventListener('click', () => {
    runActive = false; reset(); state = 'ready'; sfx.select(); refreshSel();
  });
  // Yeni oyun: iki adımlı onay, seçili kuşun kaydını siler
  const newGameBtn = document.getElementById('newGame');
  let newGameArmed = false;
  newGameBtn.addEventListener('click', () => {
    if (!storySave && !runActive) { runActive = false; reset(); state = 'ready'; sfx.select(); refreshSel(); return; }
    if (!newGameArmed) {
      newGameArmed = true; newGameBtn.classList.add('warn');
      newGameBtn.innerHTML = T('confirm') + '<small>' + T('confirm_s') + '</small>';
      setTimeout(() => { newGameArmed = false; newGameBtn.classList.remove('warn'); newGameBtn.innerHTML = T('new_game') + '<small>' + T('new_game_s') + '</small>'; }, 3000);
      return;
    }
    newGameArmed = false; newGameBtn.classList.remove('warn');
    newGameBtn.innerHTML = T('new_game') + '<small>' + T('new_game_s') + '</small>';
    writeSave(null); runActive = false; reset(); state = 'ready';
    sfx.select(); refreshSel();
  });

  // önizleme tuvallerini görünen kartların gerçek boyutuna göre kur
  function setupPreviews() {
    queenCards.forEach(c => {
      const w = c.cv.clientWidth;
      if (!w) { c.g = null; return; }
      if (c.w !== w || !c.g) { c.g = setupCanvas(c.cv, w, 76); c.w = w; }
    });
  }

  function openPanel() {
    if (state === 'play') return;
    ensureAudio();
    panelOpen = true;
    panel.classList.add('open');
    setupPreviews();
    weaponCards.forEach(c => { c.g = setupCanvas(c.cv, 104, 52); });
    refreshSel();
    wardrobeBtn.blur();
    document.getElementById('closePanel').focus({ preventScroll: true });
    panel.scrollTop = 0;
  }
  function closePanel() {
    panelOpen = false;
    panel.classList.remove('open');
    reset();           // oyuncu sayısı / seçimler uygulanır
    state = 'ready';
    sfx.select();
    canvas.focus && canvas.focus();
  }
  wardrobeBtn.addEventListener('click', (e) => { e.stopPropagation(); openPanel(); });
  document.getElementById('closePanel').addEventListener('click', closePanel);

  function previewBg(g, w, h) {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#05061a'); grd.addColorStop(1, '#1a1f4d');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 12; i++) g.fillRect((i * 37) % w, (i * 23) % (h - 10), 1, 1);
  }

  function renderPreviews() {
    queenCards.forEach((c, i) => {
      const g = c.g, w = c.w, h = 76;
      if (!g) return;
      safe(g, 'önizleme', () => {
      g.clearRect(0, 0, w, h);
      previewBg(g, w, h);
      g.save();
      g.translate(w / 2, h / 2 + 14 + Math.sin(time * 4 + i) * 2);
      g.scale(1.3, 1.3);
      drawQueen(g, QUEENS[i], (Math.sin(time * 12 + i) + 1) / 2, false);
      g.restore();
      });
    });
    weaponCards.forEach((c, i) => {
      const g = c.g, w = 104, h = 52;
      if (!g) return;
      safe(g, 'önizleme', () => {
      g.clearRect(0, 0, w, h);
      previewBg(g, w, h);
      const wp = WEAPONS[i];
      const cycle = 1.4;
      const tt = (time + i * 0.3) % cycle;
      const x = 18 + (tt / cycle) * (w - 20);
      g.save();
      g.beginPath(); g.rect(0, 0, w, h); g.clip();
      if (wp.spread) {
        [-0.2, 0, 0.2].forEach(a => drawProj(g, { w: wp.id, x, y: h / 2 + Math.tan(a) * (x - 14), vx: Math.cos(a), vy: Math.sin(a), t: time }));
      } else {
        drawProj(g, { w: wp.id, x, y: h / 2, vx: 1, vy: 0, t: wp.id === 'rainbow' ? 1 : time });
      }
      g.restore();
      });
    });
  }

  // ================= MENÜLER, AYARLAR, DURAKLATMA =================
  const menuBtn = document.getElementById('menuBtn');
  const ovl = (id) => document.getElementById(id);
  const overlayOpen = (id) => ovl(id).classList.contains('open');
  let paused = false, settingsFrom = 'menu';

  function applyLangUI() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
    fillCardTexts();
    refreshSel();
    refreshSettings();
  }
  function setLang(code) {
    lang = I18N[code] ? code : 'en';
    try { localStorage.setItem('dragyLang', lang); } catch (e) {}
    applyLangData(); applyLangUlts(); applyLangBosses();
    applyLangUI();
  }

  // menü düğmeleri klavye ile gezilebilir (Steam / kumanda dostu)
  let menuFocus = 0;
  function menuButtons(id) { return [...ovl(id).querySelectorAll('.mbtns button')]; }
  function setMenuFocus(id, i) {
    const bs = menuButtons(id);
    menuFocus = (i + bs.length) % bs.length;
    bs.forEach((b, k) => b.classList.toggle('focus', k === menuFocus));
  }
  function menuKey(e, id) {
    if (['ArrowDown', 'KeyS', 'ArrowUp', 'KeyW', 'Enter', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { setMenuFocus(id, menuFocus + 1); sfx.select(); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') { setMenuFocus(id, menuFocus - 1); sfx.select(); }
    else if (e.code === 'Enter' || e.code === 'Space') menuButtons(id)[menuFocus].click();
  }

  function openMenu() {
    if (state === 'play') endGame();
    paused = false; ovl('pause').classList.remove('open');
    if (panelOpen) { panelOpen = false; panel.classList.remove('open'); }
    state = 'menu';
    ovl('menu').classList.add('open');
    setMenuFocus('menu', 0);
  }
  ovl('menu').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    ensureAudio(); sfx.select();
    const go = b.dataset.go;
    if (go === 'settings') { openSettings('menu'); return; }
    mode = parseInt(go, 10);
    store.set('flappyMode', mode);
    runActive = false; edit = 0;
    ovl('menu').classList.remove('open');
    reset(); state = 'ready';
    loadSave();
    openPanel();
  }));
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); openMenu(); menuBtn.blur(); });
  document.getElementById('panelBack').addEventListener('click', () => { sfx.select(); openMenu(); });

  // Ayarlar
  const langBox = document.getElementById('langs');
  Object.entries(LANGS).forEach(([code, name]) => {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.lang = code;
    b.addEventListener('click', () => { setLang(code); sfx.select(); });
    langBox.appendChild(b);
  });
  const volEl = document.getElementById('volume');
  // ışık hassasiyeti uyarısı
  const warnEl = document.getElementById('warn');
  function warnOpen() { return warnEl.classList.contains('open'); }
  function closeWarn() { warnEl.classList.remove('open'); ensureAudio(); }
  warnEl.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); closeWarn(); });
  // yeni ayarlar
  const musicEl = document.getElementById('musicVol'), sfxEl = document.getElementById('sfxVol'), shakeKEl = document.getElementById('shakeK');
  musicEl.addEventListener('input', () => { OPT.music = musicEl.value / 100; saveOpt(); });
  sfxEl.addEventListener('input', () => { OPT.sfx = sfxEl.value / 100; saveOpt(); });
  sfxEl.addEventListener('change', () => { ensureAudio(); sfx.select(); });
  shakeKEl.addEventListener('input', () => { OPT.shakeK = shakeKEl.value / 100; saveOpt(); });
  shakeKEl.addEventListener('change', () => { if (OPT.shake) shake(6, 0.3); });
  document.getElementById('flashToggle').addEventListener('click', () => { OPT.lessFlash = !OPT.lessFlash; saveOpt(); sfx.select(); refreshSettings(); });
  document.getElementById('shakeToggle').addEventListener('click', () => { OPT.shake = !OPT.shake; saveOpt(); sfx.select(); refreshSettings(); if (OPT.shake) shake(6, 0.3); });
  volEl.addEventListener('input', () => { masterVol = volEl.value / 100; try { localStorage.setItem('dragyVol', masterVol); } catch (e) {} });
  volEl.addEventListener('change', () => { ensureAudio(); sfx.select(); });
  document.getElementById('soundToggle').addEventListener('click', () => { ensureAudio(); setMuted(!muted); sfx.select(); });
  // Masaüstü (Electron) sürümünde tam ekranı pencere yönetir: ESC tam ekrandan çıkarmaz, sadece duraklatır.
  const APP = window.draggyApp || null;
  const isFullscreen = () => APP ? APP.isFullscreen() : !!document.fullscreenElement;
  if (APP) APP.onFullscreenChange(() => { refreshSettings(); });
  document.getElementById('fsToggle').addEventListener('click', () => {
    if (APP) { APP.setFullscreen(!APP.isFullscreen()); return; }
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => {});
    } catch (err) {}
    setTimeout(refreshSettings, 300);
  });
  document.addEventListener('fullscreenchange', () => refreshSettings());
  document.getElementById('gfxToggle').addEventListener('click', () => { GFX.img = !GFX.img; try { localStorage.setItem('dragyGfx', GFX.img ? 'img' : 'vec'); } catch (e) {} sfx.select(); refreshSettings(); });
  function refreshSettings() {
    if (!langBox) return;
    langBox.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    const st = document.getElementById('soundToggle'); st.textContent = muted ? T('off') : T('on'); st.classList.toggle('on', !muted);
    const fs = document.getElementById('fsToggle'); const isFs = isFullscreen(); fs.textContent = isFs ? T('on') : T('off'); fs.classList.toggle('on', isFs);
    volEl.value = Math.round(masterVol * 100);
    const gf = document.getElementById('gfxToggle'); gf.textContent = GFX.img ? T('gfx_img') : T('gfx_vec'); gf.classList.toggle('on', GFX.img);
    const ft = document.getElementById('flashToggle'); ft.textContent = OPT.lessFlash ? T('on') : T('off'); ft.classList.toggle('on', OPT.lessFlash);
    const sk = document.getElementById('shakeToggle'); sk.textContent = OPT.shake ? T('on') : T('off'); sk.classList.toggle('on', OPT.shake);
    musicEl.value = Math.round(OPT.music * 100); sfxEl.value = Math.round(OPT.sfx * 100); shakeKEl.value = Math.round(OPT.shakeK * 100); shakeKEl.disabled = !OPT.shake;
  }
  function openSettings(from) { settingsFrom = from; ovl('settings').classList.add('open'); refreshSettings(); }
  function closeSettings() { ovl('settings').classList.remove('open'); sfx.select(); }
  document.getElementById('settingsBack').addEventListener('click', closeSettings);

  // Duraklatma
  function pauseGame() {
    if (state !== 'play' || paused) return;
    paused = true;
    ovl('pause').classList.add('open');
    setMenuFocus('pause', 0);
    sfx.select();
  }
  function resume() {
    paused = false;
    ovl('pause').classList.remove('open');
    last = performance.now();
    sfx.select();
  }
  ovl('pause').querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.p;
    if (a === 'resume') resume();
    else if (a === 'settings') openSettings('pause');
    else if (a === 'menu') { paused = false; ovl('pause').classList.remove('open'); endGame(); openMenu(); }
  }));
  window.addEventListener('blur', () => { if (state === 'play') pauseGame(); });   // pencere odağı kaybolunca otomatik duraklat

  // ================= OYUN KOLU (Gamepad API) =================
  // 1. takılan kol = 1. oyuncu, 2. kol = 2. oyuncu (Steam Remote Play Together'da arkadaşın kolu da böyle görünür).
  // Standart düzen: 0 A · 1 B · 2 X · 3 Y · 4 LB · 5 RB · 8 Back · 9 Start · 12-15 D-pad (yukarı/aşağı/sol/sağ)
  const PAD = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, BACK: 8, START: 9, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
  const padSlots = [null, null];          // her yuvada kolun navigator.getGamepads() indeksi
  const padPrev = {};                     // indeks → önceki karedeki tuş durumları
  const padNav = {};                      // indeks → menüde yön tekrarı için zamanlayıcı
  let padFocusEl = null;
  const padToastEl = document.getElementById('padToast');
  let padToastTimer = 0;
  function padToast(text, sub) {
    padToastEl.innerHTML = text + (sub ? '<small>' + sub + '</small>' : '');
    padToastEl.classList.add('show');
    clearTimeout(padToastTimer);
    padToastTimer = setTimeout(() => padToastEl.classList.remove('show'), 2200);
  }
  function padConnected(gp) {
    if (padSlots.includes(gp.index)) return;
    const s = padSlots.indexOf(null);
    if (s < 0) return;                    // en fazla 2 kol kullanılır
    padSlots[s] = gp.index;
    padPrev[gp.index] = gp.buttons.map(b => b.pressed);   // takılırken basılı olanlar tetiklemesin
    padToast(T('pad_on', s + 1), T('player_n', s + 1));
  }
  function padDisconnected(index) {
    const s = padSlots.indexOf(index);
    if (s < 0) return;
    padSlots[s] = null;
    delete padPrev[index]; delete padNav[index];
    padToast(T('pad_off', s + 1), T('player_n', s + 1));
    if (state === 'play' && !paused) pauseGame();   // oynarken kol çıkarsa oyun durur
  }
  window.addEventListener('gamepadconnected', (e) => padConnected(e.gamepad));
  window.addEventListener('gamepaddisconnected', (e) => padDisconnected(e.gamepad.index));

  // Açık menüdeki seçilebilir öğeler
  function padVisible(el) { return el.offsetParent !== null && !el.disabled && getComputedStyle(el).visibility !== 'hidden'; }
  function padContainer() {
    if (overlayOpen('settings')) return ovl('settings');
    if (overlayOpen('pause')) return ovl('pause');
    if (overlayOpen('menu')) return ovl('menu');
    if (panelOpen) return panel;
    return null;
  }
  function padItems(box) { return [...box.querySelectorAll('button, input[type=range]')].filter(padVisible); }
  function padSetFocus(el) {
    if (padFocusEl) padFocusEl.classList.remove('padfocus');
    padFocusEl = el;
    if (!el) return;
    el.classList.add('padfocus');
    el.focus({ preventScroll: true });
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  // Yöne göre en yakın öğeyi seç (D-pad / sol çubuk)
  function padMove(box, dx, dy) {
    const items = padItems(box);
    if (!items.length) return;
    if (!padFocusEl || !items.includes(padFocusEl)) { padSetFocus(items[0]); return; }
    const r0 = padFocusEl.getBoundingClientRect();
    const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    let best = null, bestScore = Infinity;
    for (const el of items) {
      if (el === padFocusEl) continue;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      const along = (ex - cx) * dx + (ey - cy) * dy;      // gidilen yöndeki uzaklık
      if (along <= 4) continue;
      const across = Math.abs((ex - cx) * dy) + Math.abs((ey - cy) * dx);
      const score = along + across * 2.5;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (best) { padSetFocus(best); sfx.select(); }
  }
  function padBack() {
    if (overlayOpen('settings')) { closeSettings(); return; }
    if (overlayOpen('pause')) { resume(); return; }
    if (overlayOpen('menu')) return;
    if (panelOpen) { closePanel(); return; }
  }
  function padActivate(box, slot) {
    const el = padFocusEl && padItems(box).includes(padFocusEl) ? padFocusEl : null;
    if (!el) { padMove(box, 0, 1); return; }
    if (el.type === 'range') return;
    // 2P gardırop: A'ya hangi kol bastıysa seçim o oyuncuya yazılır
    if (box === panel && mode === 2 && slot !== edit && el.closest('#queens, #weapons')) { edit = slot; refreshSel(); }
    ensureAudio();
    el.click();
  }
  function padSlider(el, dir) {
    const step = parseFloat(el.step) || 5;
    el.value = Math.max(+el.min, Math.min(+el.max, +el.value + dir * step));
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function pollPads(dt) {
    if (!navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    for (const gp of pads) if (gp && gp.connected && !padSlots.includes(gp.index)) padConnected(gp);   // olay kaçarsa
    for (let s = 0; s < 2; s++) {
      const idx = padSlots[s];
      if (idx === null) continue;
      const gp = pads[idx];
      if (!gp || !gp.connected) { padDisconnected(idx); continue; }
      const down = gp.buttons.map(b => b.pressed || b.value > 0.5);
      const prev = padPrev[idx] || [];
      const hit = (b) => down[b] && !prev[b];
      padPrev[idx] = down;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const box = padContainer();

      if (warnOpen()) { if (down.some((d, i) => d && !prev[i])) closeWarn(); continue; }
      if (state === 'title') { if (down.some((d, i) => d && !prev[i])) { ensureAudio(); openMenu(); } continue; }

      if (box) {
        // Menü gezinmesi: ilk basışta hemen, basılı tutunca tekrar eder
        let dx = 0, dy = 0;
        if (down[PAD.LEFT] || ax < -0.55) dx = -1; else if (down[PAD.RIGHT] || ax > 0.55) dx = 1;
        if (down[PAD.UP] || ay < -0.55) dy = -1; else if (down[PAD.DOWN] || ay > 0.55) dy = 1;
        if (dx && dy) { if (Math.abs(ax) > Math.abs(ay)) dy = 0; else dx = 0; }
        const nav = padNav[idx] || (padNav[idx] = { key: '', t: 0 });
        const key = dx + ',' + dy;
        let fire = false;
        if (key === '0,0') nav.key = '';
        else if (key !== nav.key) { nav.key = key; nav.t = 0.38; fire = true; }
        else { nav.t -= dt; if (nav.t <= 0) { nav.t = 0.12; fire = true; } }
        if (fire) {
          if (padFocusEl && padFocusEl.type === 'range' && dx && padItems(box).includes(padFocusEl)) padSlider(padFocusEl, dx);
          else if (box === ovl('menu') || box === ovl('pause')) {
            if (dy) { const id = box.id; setMenuFocus(id, menuFocus + dy); padSetFocus(menuButtons(id)[menuFocus]); sfx.select(); }
          } else padMove(box, dx, dy);
        }
        if (hit(PAD.A)) {
          if (box === ovl('menu') || box === ovl('pause')) { ensureAudio(); menuButtons(box.id)[menuFocus].click(); }
          else padActivate(box, s);
        }
        if (hit(PAD.B)) padBack();
        if (hit(PAD.START) && box === ovl('pause')) resume();
        else if (hit(PAD.START) && panelOpen && !overlayOpen('settings')) closePanel();   // Start: sahneye çık
        continue;
      }
      if (padFocusEl) padSetFocus(null);

      // Oyun içi
      if (hit(PAD.START)) { if (state === 'play') pauseGame(); else openMenu(); continue; }
      if (paused) continue;
      if (hit(PAD.BACK) && state !== 'play') { openPanel(); continue; }
      const pi = mode === 2 ? s : 0;      // tek kişilik modlarda her kol 1. oyuncuyu yönetir
      if (hit(PAD.A)) flap(pi);
      if (down[PAD.X] || down[PAD.RB]) shoot(pi);   // basılı tutunca seri ateş (silah bekleme süresi geçerli)
      if (hit(PAD.Y) || hit(PAD.LB)) useUlt(pi);
    }
  }

  // ================= DÖNGÜ =================
  let last = performance.now(), lastBtnVis = null, lastCursorHidden = null;
  function loop(now) {
    // ilk karede zaman damgası geriye düşebilir: dt asla eksi olmasın
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    // bir karede hata olsa bile oyun döngüsü durmasın
    lastErrT = Math.max(0, lastErrT - dt);
    safe(ctx, 'kol', () => pollPads(dt));
    const DBG = DEBUG_KEYS ? window.__dbg : null;
    const steps = DBG && DBG.steps > 1 ? DBG.steps : 1;   // test: simülasyonu hızlandır
    for (let k = 0; k < steps; k++) {
      if (DBG && DBG.onTick && !paused) { try { DBG.onTick(dt); } catch (err) { DBG.err = String(err); } }
      if (!paused) safe(ctx, 'güncelleme', () => update(dt));
    }
    if (!(DBG && DBG.noRender)) render();
    if (panelOpen) renderPreviews();
    const anyOverlay = overlayOpen('menu') || overlayOpen('settings') || overlayOpen('pause');
    const vis = (state === 'ready' || state === 'dead') && !panelOpen && !anyOverlay;
    if (vis !== lastBtnVis) {
      wardrobeBtn.style.display = vis ? 'block' : 'none';
      menuBtn.style.display = vis ? 'block' : 'none';
      lastBtnVis = vis;
    }
    // oynarken fare imlecini gizle, çıkış düğmesini göster
    const hide = state === 'play' && !panelOpen && !paused;
    if (hide !== lastCursorHidden) {
      document.body.classList.toggle('playing', hide);
      exitBtn.style.display = hide ? 'block' : 'none';
      lastCursorHidden = hide;
    }
    requestAnimationFrame(loop);
  }

  // GEÇİCİ TEST ARAYÜZÜ (DEBUG_KEYS ile birlikte kapanır): bot testi ve ekran görüntüleri için
  if (DEBUG_KEYS) window.__dbg = {
    steps: 1, noRender: false, onTick: null, err: null,
    get st() { return { state, mode, paused, lives, bossCount, bossPhase, nextBossAt, speed, timeStopT, W, H, GROUND_H, PIPE_W }; },
    get p() { return players; }, get boss() { return boss; }, get eb() { return ebullets; }, get pipes() { return pipes; },
    get enemies() { return enemies; }, get banners() { return banners; },
    flap: (i = 0) => flap(i), shoot: (i = 0) => shoot(i), ult: (i = 0) => useUlt(i),
    setFlash: (f) => { flash = f; stormFlash = f; }, opt: OPT,
    art: () => boss ? { c: bossCircs(boss), m: bossMouth(boss), h: bossHeadTop(boss) } : null,
    danger: (x, y, r, dt) => (typeof predictDanger === 'function' ? predictDanger(x, y, r, dt) : 0),
    // hikayeyi L. boss'un hemen öncesinden başlat (q: hikaye kuşu indeksi)
    story(L = 0, q, pre) {
      ensureAudio(); mode = 3; runActive = false; closeWarn();
      if (q != null) storySel.queen = q;
      ovl('menu').classList.remove('open'); panelOpen = false; panel.classList.remove('open');
      storySave = null; reset(); state = 'play'; runActive = true;
      bossCount = L; nextBossAt = (L + 1) * BOSS_EVERY; players[0].score = score = pre ? nextBossAt - BOSS_EVERY : nextBossAt;   // pre: sütun bölümünden başla
      setStoryTheme(storyTheme(), true); for (const q2 of pipes) q2.theme = storyTheme();
    },
    lives: (n) => { lives = n; },
    ready() { ensureAudio(); closeWarn(); mode = 3; runActive = false; ovl('menu').classList.remove('open'); panelOpen = false; panel.classList.remove('open'); storySave = null; reset(); state = 'ready'; partyOn = false; },
    party: (t) => { partyOn = true; partyT = t; },
    get partyT() { return partyT; },
  };

  reset();
  refreshSel();
  setLang(lang);
  state = 'title';   // açılışta DRAGGY BIRD logosu
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
